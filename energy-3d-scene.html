<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Энергосцена — 3D scroll demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000000; }
    html { scrollbar-color: #777777 #000000; }
    body { overflow-x: hidden; }
    .flight { position: relative; height: 2350svh; }
    .screen {
      position: sticky; top: 0; width: 100%; height: 100svh; min-height: 0;
      overflow: hidden; background: #000000; isolation: isolate;
    }
    .screen::after {
      content: ""; position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 53%, transparent 30%, rgba(2,6,14,.008) 72%, rgba(2,6,14,.025) 100%);
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    @media (max-width: 700px) {
      .screen { min-height: 0; }
      .flight { height: 2000svh; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="flight" aria-label="Интерактивная 3D-сцена энергопередачи">
    <div class="screen">
      <canvas id="scene" aria-label="Три электрических потока проходят через здания и включают свет"></canvas>
    </div>
  </main>
  <script>
    (function () {
      "use strict";

      var ctx = canvas.getContext("2d", { alpha: false });
      var width = 0;
      var height = 0;
      var dpr = 1;
      var focal = 600;
      var scrollProgress = 0;
      var cameraZ = 18;
      var cameraX = 0;
      var cameraY = 2.6;
      var cameraForward = [0,0,-1];

      var cameraUp = [0,1,0];
      var backgroundLightness = 0;
      var contourMix=0,contourTransition=0,lastContrastTime=0;
      var contourBase=[205,205,205],contourGlint=[250,250,250],contourHalo=[4,4,4];
      var skyLayer=document.createElement("canvas"),skyContext=skyLayer.getContext("2d");

      var cameraTrackLength = 0;

      var cameraTarget = [0,0,0];
      var previousTarget = [0,0,0];
      var lastFrame = 0;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function point(x, y, z) { return [x, y, z]; }

        var out = [];

      }

      const stops = [
        {front:-19, back:-25, left:-30,right:-12, socket:[-18,1.35,-19], kind:0},
        {front:-49, back:-57, left:3,right:15, socket:[9,1.35,-49], kind:1},
        {front:-81,back:-90,left:-25,right:-7,socket:[-13,1.35,-81],kind:0},
        {front:-114,back:-124,left:2,right:17,socket:[8,1.35,-114],kind:1}
      ];
      const route = sampleCurve([
        [0,2.8,6],[0,2.5,3],[0,2,-5],[-8,1.5,-13],stops[0].socket,
        [-16,1.35,-21.4],[-13,1.35,-22.4],[-12,1.65,-25],[-8,2.5,-33],
        [4,2,-40],[9,1.35,-46],stops[1].socket,[8,1.35,-51],
        [3,1.35,-53],[0,1.65,-55],[-2,2.1,-61],[0,2.8,-68],[-9,1.5,-76],stops[2].socket,[-12,1.35,-84],[-8,1.7,-89],[0,2.4,-99],[8,1.35,-110],stops[3].socket,[7,1.35,-118],[0,2,-126],[0,3,-143],
        [0,3,-160],[3,3,-174],[14,3,-183],[33,3,-185],[56,3,-185],[76,3,-185],[80,3,-185],
        [84,3,-185],[100,3,-185],[116,3,-185],[132,3,-185],[148,3,-185],
        [164,3,-185],[180,3,-185],[196,3,-185],[212,3,-185],[228,3,-185],
        [252,3,-185],[280,3,-185],[308,3,-185],[330,3,-185],[341,3,-185],
        [344,8,-185],[347,22,-185],[349,38,-185],[352,53,-185],
        [363,65,-185],[378,76,-185],[392,72,-185],[405,66,-187],
        [416,62,-197],[423,61,-215],[425,61,-240],[425,61,-274],
        [425,61,-310],[425,61,-347],[425,61,-385],[425,61,-423],
        [425,61,-454],[425,61,-485]
      ],36);      function at(i){i=Math.max(0,Math.min(route.length-1,i));var k=Math.floor(i),a=route[k],b=route[Math.min(k+1,route.length-1)];return a.map((v,j)=>v+(b[j]-v)*(i-k))}
      var sceneStart=90;
      var originalRouteEnd=26*36;
      var routeDistances=[0];
      for(var distanceIndex=1;distanceIndex<route.length;distanceIndex++){
        var previous=route[distanceIndex-1],current=route[distanceIndex];
        routeDistances.push(routeDistances[distanceIndex-1]+Math.hypot(current[0]-previous[0],current[1]-previous[1],current[2]-previous[2]));
      }
      var cameraTrailDistance=32;
      function routeDistanceAt(index){
        var segment=Math.floor(index),next=Math.min(route.length-1,segment+1),fraction=index-segment;

      }
      function pointBehind(index,distance){
        var target=Math.max(0,routeDistanceAt(index)-distance),low=0,high=routeDistances.length-1;

        if(low===0)return route[0].slice();

      }
      function camera(i){
        var head=at(i), rear=at(i-38);
        cameraX=head[0]*.88; cameraY=3.7+Math.min(2,head[1]*.1); cameraZ=head[2]+22;
        function unit(v){var l=Math.hypot(...v)||1;return v.map(n=>n/l)}
        var turn=smoothstep((i-originalRouteEnd)/90);
        var before=at(i-18),after=at(i+18),heading=unit([after[0]-before[0],0,after[2]-before[2]]);
        var followDistance=32+Math.max(0,72*focal/(width*1.04)-38)*turn;
        cameraTrailDistance=followDistance;
        var cameraTrackPoint=pointBehind(i,followDistance);
        cameraX+=(cameraTrackPoint[0]-cameraX)*turn;
        cameraZ+=(cameraTrackPoint[2]-cameraZ)*turn;
        cameraY+=(4.6-cameraY)*turn;
        var ascent=smoothstep((head[1]-3)/12);
        cameraY+=(cameraTrackPoint[1]+2-cameraY)*ascent;
        var targetX=head[0]+heading[0]*5*turn;
        var targetZ=head[2]-3*(1-turn)+heading[2]*5*turn;

      var currentRouteIndex=0;
      function nearestRouteIndex(x,z,start){

        for(var i=Math.max(0,start||originalRouteEnd);i<route.length;i+=2){

          if(distance<bestDistance){bestDistance=distance;best=i;}

      var polyBuffer=[];
      for(var pb=0;pb<64;pb++) polyBuffer.push({x:0,y:0,scale:0,visible:false});

      function resize() {
        var rect=canvas.getBoundingClientRect();

        dpr=Math.min(window.devicePixelRatio||1,2);

      function worldDepth(p){return (p[0]-cameraX)*cameraForward[0]+(p[1]-cameraY)*cameraForward[1]+(p[2]-cameraZ)*cameraForward[2]}

      }
      function strokePath3D(points,color,alpha,lineWidth,dash,dashOffset) {

      function wrappedDistance(a,b) {
        var d=Math.abs(a-b);

      }

      function pulsePhase(index,time) {

      function signalAt(route,at,time) {

      }

      var backgroundPalette=[
        {at:0,color:[0,0,0]}, {at:.29,color:[0,0,0]},
        {at:.33,color:[255,255,255]}, {at:.68,color:[255,255,255]},

      function mixColor(a,b,t) {

          Math.round(a[0]+(b[0]-a[0])*t),
          Math.round(a[1]+(b[1]-a[1])*t),
          Math.round(a[2]+(b[2]-a[2])*t)

      }

      function parseColor(hex) {
        return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
      }

      function rgb(color,alpha) {
        return alpha===undefined?"rgb("+color.join(",")+")":"rgba("+color.join(",")+","+alpha+")";
      }

      function backgroundColor(progress) {
        var index=0;
        while(index<backgroundPalette.length-2&&backgroundPalette[index+1].at<progress) index++;

        var t=smoothstep((progress-a.at)/(b.at-a.at));

      }

      function drawBackground() {
        var color=backgroundColor(currentRouteIndex/(route.length-1));

      function maskArchitecture(points){

      // Continuous streetscape: staggered architecture frames both sides of the journey.

          for(var cabinet=0;cabinet<4;cabinet++){

          frameBox(-17,-9,.2,2.6,-49,-61,.89,.64,'#202020');
          function spindleRing(x,y,z,r,stage){var circle=[];for(var k=0;k<=32;k++){var angle=k/32*Math.PI*2;circle.push([x+Math.cos(angle)*r,y+Math.sin(angle)*r,z]);}line(circle,stage,.7);}

          line([[-16,2.2,-52],[-10,2.2,-52],[-10,2.2,-58],[-16,2.2,-58]],.94,.58);

          frameBox(-15.5,-9.5,2.1,3.2,-79,-84,.95,.58,'#282828');
          // Rounded vessel hoops, access ladders and roof safety railings.
          for(var tank=0;tank<2;tank++){
            var x=39+tank*9,top=11+tank*2;
            for(var y of [.4,top*.4,top*.75,top])ring(x,y,-9,3.44,.6);

            for(var k=0;k<12;k++){var angle=k/12*Math.PI*2;line([[x+Math.cos(angle)*3.2,top,-9+Math.sin(angle)*3.2],[x+Math.cos(angle)*3.2,top+1.05,-9+Math.sin(angle)*3.2]],.7,.45);}

            for(var y=.4;y<top+.8;y+=.45)line([[x-.22,y,-5.5],[x+.22,y,-5.5]],.7,.4);
          }
          // Pipe rack remains outside the hall with a six-metre entrance gap.
          for(var side of [-1,1]){
            var begin=side<0?-26:6,end=side<0?-6:26;
            for(var y of [6.05,6.4,6.75])line([[begin,y,6.3],[end,y,6.3]],.6,.85);
            for(var x=begin;x<=end;x+=2){line([[x,5.8,6.3],[x,7.1,6.3]],.68,.45);}
            line([[begin,7.1,6.3],[end,7.1,6.3]],.7,.5);
          }
          // Service pipes use broad, rounded elbows to connect the tank yard.
          for(var y of [2.2,2.65]){
            var pipe=[[28,y,6.3],[37,y,6.3]];
            for(var k=1;k<=12;k++){var angle=k/12*Math.PI/2;pipe.push([37+2*Math.sin(angle),y,4.3+2*Math.cos(angle)]);}
            pipe.push([39,y,-5.5]);line(pipe,.65,.8);
          }
          // Forecourt: short fencing, parking/loading marks and slender light poles.
          for(var side of [-1,1]){
            var inner=side*8,outer=side*31;
            for(var z of [10,17])line([[inner,0,z],[outer,0,z]],.45,.55,.6);
            for(var x=10;x<=30;x+=5)line([[side*x,0,10],[side*x,0,17]],.6,.45,.55);
            for(var x of [9,15,21,27]){
              line([[side*x,0,20],[side*x,1.2,20]],.55,.7);
            }
            line([[side*9,.55,20],[side*27,.55,20]],.65,.5);
            for(var x of [12,29]){
              var sx=side*x;
              line([[sx,0,13],[sx,7,13],[sx-side*.35,7.6,13],[sx-side*1.8,7.6,13]],.55,.75);
              line([[sx-side*1.4,7.5,13],[sx-side*2.2,7.5,13]],.7,1.5);
            }
          }
          // Silo seams and roof guards, with a common transfer conveyor behind the vessels.
          for(var sx of [-30,-22,-14]){
            for(var y of [2,7,12,16])ring(sx,y,27,2.74,.4);
            ring(sx,17.7,27,2.1,.65);
            for(var k=0;k<10;k++){var a=k/10*Math.PI*2;line([[sx+Math.cos(a)*2.1,17.1,27+Math.sin(a)*2.1],[sx+Math.cos(a)*2.1,17.7,27+Math.sin(a)*2.1]],.65,.4);}
            for(var dx of [-.2,.2])line([[sx+dx,1.8,29.8],[sx+dx,17.7,29.8]],.45,.55);
            for(var y=2;y<17.5;y+=.55)line([[sx-.2,y,29.82],[sx+.2,y,29.82]],.65,.4);
          }
          for(var y of [15.6,16.2])line([[-32,y,23.8],[-12,y,23.8]],.6,.65);
          for(var sx=-32;sx<=-12;sx+=2)line([[sx,15.6,23.8],[sx+2,16.2,23.8]],.65,.4);
          // Insulator stacks, bus bars and access fencing distinguish the electrical yard.
          for(var sx of [21,27,33]){
            for(var sz of [34.6,36.3]){
              line([[sx,3.6,sz],[sx,5.6,sz]],.45,.7);
              for(var y=3.8;y<5.4;y+=.25)ring(sx,y,sz,.22,.55);
            }
          }
          for(var sz of [34.6,36.3])line([[21,5.6,sz],[33,5.6,sz]],.6,.8);
          for(var sx=18;sx<=36;sx+=2)line([[sx,0,31.5],[sx,1.7,31.5]],.4,.5);
          for(var y of [.5,1.5])line([[18,y,31.5],[36,y,31.5]],.55,.55);
          // Capsule vessel hoops and a pressure gauge on its top service connection.
          for(var sz of [23.1,28,32.9]){
            var hoop=[];for(var k=0;k<=40;k++){var a=k/40*Math.PI*2;hoop.push([20+Math.cos(a)*2.04,3.6+Math.sin(a)*2.04,sz]);}line(hoop,.45,.6);
          }
          line([[20,5.6,28],[20,6.4,28]],.55,.7);
          var gauge=[];for(var k=0;k<=24;k++){var a=k/24*Math.PI*2;gauge.push([20+Math.cos(a)*.32,6.7+Math.sin(a)*.32,28]);}line(gauge,.65,.65);
          // Longitudinal pipe runs terminate at the forecourt racks and stay clear of the entrance.
          for(var sx of [-15,15]){
            for(var dx of [-.24,0,.24])line([[sx+dx,7.35,36],[sx+dx,7.35,66]],.35,.7);
            for(var sz of [36,46,56,66]){
              line([[sx-.6,7.1,sz],[sx+.6,7.1,sz]],.4,.6);
              line([[sx,0,sz],[sx,2.5,sz+2]],.5,.45);
            }
          }
          // Louvred compressor intake and three motor housings outside the pump station.
          for(var x=-29;x<-18;x+=.6)line([[x,1,60.08],[x,4,60.08]],.55,.45);
          for(var sx of [-29,-24,-19]){
            line([[sx,0,43],[sx,2,43],[sx+2.5,2,43],[sx+2.5,0,43]],.5,.65);
            line([[sx,1.6,43],[sx+2.5,1.6,43]],.65,.4);
          }
          // Stack collars and a small service platform complete the upper silhouette.
          for(var stack=0;stack<2;stack++){
            var x=-20+stack*6,top=stack?43:47;
            for(var y of [25,top-1,top])ring(x,y,-22,1.18,.7);
          }
          building.detailPaths=paths;
          building.detailPanels=panels;
        }
      }
      function drawFactoryDetails(building,head){
        var grow=drawingProgress(building,head);if(grow<=0)return;
        building.detailPanels.forEach(function(item){
          var amount=detailAmount(grow,item.stage);
          // Subtle opaque shading separates the equipment from the black background.
          if(amount>.01)fillSurface3D(item.points,item.color,amount);
        });
        building.detailPaths.forEach(function(path){
          var points=partialPath3D(path.points,detailAmount(grow,path.stage));
          strokePath3D(points,rgb(contourHalo),.2,2);
          strokePath3D(points,rgb(contourBase),.82*path.alpha,path.weight);
        });
        building.interiorLamps.forEach(function(lamp){
          var power=factoryPower(lamp[0],0)*detailAmount(grow,.72);
          if(power<=0)return;
          var strip=[[lamp[0]-2.45,lamp[1],lamp[2]-.38],[lamp[0]+2.45,lamp[1],lamp[2]-.38],[lamp[0]+2.45,lamp[1],lamp[2]+.38],[lamp[0]-2.45,lamp[1],lamp[2]+.38]];
          var beam=[[lamp[0]-2.4,lamp[1]-.02,lamp[2]],[lamp[0]+2.4,lamp[1]-.02,lamp[2]]];
          var a=projectInto(...beam[0],{}),b=projectInto(...beam[1],{});
          var glowWidth=a.visible&&b.visible?Math.max(4,Math.min(18,Math.hypot(b.x-a.x,b.y-a.y)*.28)):8;
          ctx.save();
          ctx.globalCompositeOperation='lighter';
          ctx.shadowColor='#ffe7bc';
          ctx.shadowBlur=glowWidth*1.2;
          strokePath3D(beam,'#ffe7bc',power*.18,glowWidth);
          strokePath3D(beam,'#fff4dc',power*.34,glowWidth*.38);
          ctx.restore();
          fillSurface3D(strip,'#ffe5b9',power*.95);
          strokePath3D(beam,'#fff7e5',power*.55,1.25);
        });
        building.powerBranches.forEach(function(branch){
          var power=factoryPower(branch.entry,0)*detailAmount(grow,.8);
          strokePath3D(branch.points,rgb(contourBase),(.28+power*.55)*detailAmount(grow,.8),1);
          if(power>0)strokePath3D(branch.indicator,'#ffe0a3',power,2.5);
        });

      }
      var lanes=[-1,0,1];
      function ribbonStart(i){
        var minimum=i-380;
        for(var k=i-88;k>minimum;k-=4){
          var p=at(k);p[1]=Math.max(.24,p[1]-2.76);
          if(k<0)p[2]+=(-k)*.12;
          if(worldDepth(p)<-18)return k;
        }
        return minimum;
      }
      function buildRibbon(i,lane){
        var line=[],start=ribbonStart(i),end=i+4;
        line.routeStart=start;line.routeStep=.65;
        var wireIndex=lane+1;
        for(var k=start;k<end;k+=.65){
          var v=at(k);v[1]=Math.max(.24,v[1]-2.76);
          if(k<0)v[2]+=(-k)*.12;
          var turn=smoothstep((k-originalRouteEnd)/90),a=at(k-1),b=at(k+1);
          var dx=b[0]-a[0],dz=b[2]-a[2],length=Math.hypot(dx,dz)||1;
          var nx=1-turn+(-dz/length)*turn,nz=(dx/length)*turn;
          var base=[-1.55,0,1.55][wireIndex],amplitude=[.18,.24,.18][wireIndex];
          var frequency=[.021,.017,.024][wireIndex],phase=[.7,2.35,4.65][wireIndex];
          var lateral=base+amplitude*Math.sin(k*frequency+phase)+.04*Math.sin(k*.052+phase*1.7);
          var attachment=[0,0,0];
          stops.forEach(function(stop){
            var distance=Math.hypot(v[0]-stop.socket[0],v[2]-stop.front);
            var influence=1-smoothstep((distance-2)/14);
            var offsets=stop===stops[0]?[-.3,-.05,-3.2]:stop.kind===0?[-.3,-.05,2.9]:[-2.0,-2.1,.1];
            attachment[wireIndex]+=offsets[wireIndex]*influence;
          });
          lateral+=attachment[wireIndex];
          var vertical=lane*.055+.065*Math.cos(k*frequency*.82+phase);
          var p=[v[0]+nx*lateral,v[1]+vertical,v[2]+nz*lateral];
          line.push(p);
        }
        return line;
      }
      function ribbonPoint(line,index){
        index=Math.max(0,Math.min(line.length-1,index));var n=Math.floor(index),t=index-n,a=line[n],b=line[Math.min(n+1,line.length-1)];
        return a.map((v,j)=>v+(b[j]-v)*t);
      }
      var wireColors=[[0,117,190],[40,53,130],[118,183,42]];
      function drawInnerCurrent(ribbons,time){
        var reveal=smoothstep(scrollProgress/.025);
        if(reveal<=0)return;
        var speeds=[.23,.19,.21],offsets=[.08,.47,.76];
        ribbons.forEach(function(line,lane){
          if(line.length<2)return;
          var color=wireColors[lane],length=line.length-1;
          var weight=(width<700?.78:1)*(lane===0?1.2:lane===1?.82:.9);
          // A faint conductor remains visible when its energy pulse has passed.
          strokePath3D(line,rgb(mixColor(color,[210,225,245],.45)),(.19+(lane===0?.03:0))*reveal,1.35*weight);
          var phase=reduceMotion?offsets[lane]:((time*speeds[lane]+offsets[lane])%1+1)%1;
          var tail=length*.72,sections=16;
          ctx.save();
          ctx.globalCompositeOperation='lighter';
          ctx.shadowColor=rgb(color);
          ctx.shadowBlur=width<700?7:11;
          // Two overlapping pulses keep colour moving across the whole conductor.
          for(var pulse=0;pulse<2;pulse++){
            var head=((phase+pulse*.5)%1)*length;
            for(var section=0;section<sections;section++){
              var from=head-tail+tail*section/sections;
              var to=head-tail+tail*(section+1)/sections;
              var t=(section+.5)/sections;
              var fade=.1+.9*t*t*(3-2*t);
              var hot=smoothstep((t-.72)/.28);
              var tone=rgb(mixColor(color,[250,253,255],hot*.9));
              var path=[];
              // Split at the loop boundary so the pulse never draws a straight seam.
              for(var sample=0;sample<=10;sample++){
                var position=from+(to-from)*sample/10;
                if(sample&&Math.floor(position/length)!==Math.floor((from+(to-from)*(sample-1)/10)/length)){
                  if(path.length>1){
                    strokePath3D(path,rgb(color),fade*.16*reveal,8*weight);
                    strokePath3D(path,tone,fade*.74*reveal,2.7*weight);
                    if(hot>0)strokePath3D(path,'rgb(255,255,255)',hot*fade*.72*reveal,.85*weight);
                  }
                  path=[];
                }
                path.push(ribbonPoint(line,((position%length)+length)%length));
              }
              if(path.length>1){
                strokePath3D(path,rgb(color),fade*.16*reveal,8*weight);
                strokePath3D(path,tone,fade*.74*reveal,2.7*weight);
                if(hot>0)strokePath3D(path,'rgb(255,255,255)',hot*fade*.72*reveal,.85*weight);
              }
            }
          }
          ctx.restore();
        });
      }
      function draw(){
        const i=sceneStart+scrollProgress*(route.length-1-sceneStart),head=at(i);
        currentRouteIndex=i;
        camera(i);
        drawBackground();skyContext.drawImage(canvas,0,0);drawStreetscape(head);drawHydroScene(head);
        var ribbons=lanes.map(lane=>buildRibbon(i,lane));
        drawInnerCurrent(ribbons,performance.now()/1000);
      }
      function render(time) { draw(time); }

      var target=0,raf=0;
      function tick(){raf=0;scrollProgress+=(target-scrollProgress)*(reduceMotion?1:.14);if(Math.abs(target-scrollProgress)<.0001)scrollProgress=target;draw();if(target!==scrollProgress || (!document.hidden))raf=requestAnimationFrame(tick)}
      function update(){target=Math.min(1,Math.max(0,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)));if(!raf)raf=requestAnimationFrame(tick)}
      document.addEventListener("visibilitychange",update);addEventListener("scroll",update,{passive:true});addEventListener("resize",resize);resize();update();
    })();
  </script>
