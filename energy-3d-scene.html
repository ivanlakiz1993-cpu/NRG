<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Энергосцена — 3D scroll demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000000; }
    html { scrollbar-color: #777777 #000000; }
    body { overflow-x: hidden; }
    .flight { position: relative; height: 2250svh; }
    .screen {
      position: sticky; top: 0; width: 100%; height: 100svh; min-height: 0;
      overflow: hidden; background: #000000; isolation: isolate;
    }
    .screen::after {
      content: ""; position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 53%, transparent 30%, rgba(2,6,14,.008) 72%, rgba(2,6,14,.025) 100%);
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    @media (max-width: 700px) {
      .screen { min-height: 0; }
      .flight { height: 1920svh; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="flight" aria-label="Интерактивная 3D-сцена энергопередачи">
    <div class="screen">
      <canvas id="scene" aria-label="Три электрических потока проходят через город и плотину, входят в три индикатора и включают карту России"></canvas>
    </div>
  </main>
  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("scene");
      var ctx = canvas.getContext("2d", { alpha: false, willReadFrequently: false });
      var width = 0;
      var height = 0;
      var dpr = 1;
      var focal = 600;
      var scrollProgress = 0;
      var cameraZ = 18;
      var cameraX = 0;
      var cameraY = 2.6;
      var cameraForward = [0,0,-1];
      var cameraRight = [1,0,0];
      var cameraUp = [0,1,0];
      var backgroundLightness = 0;
      var contourMix=0,contourTransition=0,lastContrastTime=0;
      var contourBase=[205,205,205],contourGlint=[250,250,250],contourHalo=[4,4,4];
      var skyLayer=document.createElement("canvas"),skyContext=skyLayer.getContext("2d",{alpha:false,willReadFrequently:false});
      var cameraTrack;
      var cameraTrackLength = 0;
      var cameraTrackDistances = [];
      var cameraPosition = [0,0,0];
      var cameraTarget = [0,0,0];
      var previousTarget = [0,0,0];
      var lastFrame = 0;
      var motionQuery=window.matchMedia("(prefers-reduced-motion: reduce)");
      var reduceMotion=motionQuery.matches;
      // Geometry is immutable. Keep derived paths until their shape or camera changes.
      var pathData=new WeakMap(),projectedPaths=new WeakMap(),projectedWindows=new WeakMap(),viewKey='',viewRevision=0;
      var combinedStrokes=new WeakMap(),ribbonCache=[];
      function geometryData(points){
        var data=pathData.get(points);
        if(!data){
          var lengths=[],total=0;
          for(var i=1;i<points.length;i++){
            var a=points[i-1],b=points[i],length=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
            lengths.push(length);total+=length;
          }
          data={lengths:lengths,total:total};pathData.set(points,data);
        }
        return data;
      }
      function closedPath(points){
        var data=geometryData(points);
        return data.closed||(data.closed=points.concat([points[0]]));
      }
      function panePaths(points){
        var data=geometryData(points);
        if(!data.mullions){
          var mid=(a,b)=>a.map((v,i)=>(v+b[i])*.5);
          data.mullions=[[mid(points[0],points[1]),mid(points[3],points[2])],[mid(points[0],points[3]),mid(points[1],points[2])]];
          data.sill=[points[0],points[1]];
        }
        return data;
      }
      function prepareView(){
        var key=[width,height,dpr,cameraX,cameraY,cameraZ,...cameraForward].join();
        if(key===viewKey)return;
        viewKey=key;viewRevision++;
        projectedPaths=new WeakMap();projectedWindows=new WeakMap();
      }
      function projectedPolygon(points){
        var projected=projectedPaths.get(points);
        if(!projected){projected=clipPolygon(points).map(p=>projectInto(...p,{}));projectedPaths.set(points,projected);}
        return projected;
      }
      function polygonOnScreen(projected,margin){
        if(projected.length<3)return false;
        if(margin===undefined)margin=64;
        var left=Infinity,right=-Infinity,top=Infinity,bottom=-Infinity;
        for(var i=0;i<projected.length;i++){
          var p=projected[i];left=Math.min(left,p.x);right=Math.max(right,p.x);top=Math.min(top,p.y);bottom=Math.max(bottom,p.y);
        }
        return right>=-margin&&left<=width+margin&&bottom>=-margin&&top<=height+margin;
      }

      function point(x, y, z) { return [x, y, z]; }

function sampleCurve(controlPoints, samplesPerLeg) {
        var out = [];
        for (var i=0;i<controlPoints.length-1;i++) {
          var p0=controlPoints[Math.max(0,i-1)], p1=controlPoints[i];
          var p2=controlPoints[i+1], p3=controlPoints[Math.min(controlPoints.length-1,i+2)];
          for (var j=0;j<samplesPerLeg;j++) {
            var t=j/samplesPerLeg, t2=t*t, t3=t2*t;
            var x=.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
            var y=.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
            var z=.5*(2*p1[2]+(-p0[2]+p2[2])*t+(2*p0[2]-5*p1[2]+4*p2[2]-p3[2])*t2+(-p0[2]+3*p1[2]-3*p2[2]+p3[2])*t3);
            out.push(point(x,y,z));
          }
        }
        out.push(controlPoints[controlPoints.length-1]);
        return out;
      }

      const stops = [
        {front:-19, back:-25, left:-30,right:-12, socket:[-18,1.35,-19], kind:0},
        {front:-49, back:-57, left:3,right:15, socket:[9,1.35,-49], kind:1},
        {front:-81,back:-90,left:-25,right:-7,socket:[-13,1.35,-81],kind:0},
        {front:-114,back:-124,left:2,right:17,socket:[8,1.35,-114],kind:1}
      ];
      const route = sampleCurve([
        [0,2.8,6],[0,2.5,3],[0,2,-5],[-8,1.5,-13],stops[0].socket,
        [-19,1.35,-23],[-16,1.35,-27],[-11,1.65,-31],[-8,2.5,-34],
        [4,2,-40],[9,1.35,-46],stops[1].socket,[8,1.35,-51],
        [3,1.35,-53],[0,1.65,-55],[-2,2.1,-61],[0,2.8,-68],[-9,1.5,-76],stops[2].socket,[-12,1.35,-84],[-8,1.7,-89],[0,2.4,-99],[8,1.35,-110],stops[3].socket,[7,1.35,-118],[0,2,-126],[0,3,-143],
        [0,3,-160],[0,3,-179],[11,3,-185],[33,3,-185],[56,3,-185],[76,3,-185],[80,3,-185],
        [84,3,-185],[100,3,-185],[116,3,-185],[132,3,-185],[148,3,-185],
        [164,3,-185],[180,3,-185],[196,3,-185],[212,3,-185],[228,3,-185],
        [252,3,-185],[280,3,-185],[308,3,-185],[330,3,-185],[341,3,-185],
        [349,8,-185],[352,22,-185],[355,38,-185],[358,53,-185],
        [361,59,-185],[378,59,-185]
      ],36);
      var mapRiseEnd=route.length-1;
      // Continue beyond the dam far enough for the following camera to clear it.
      route.push(...sampleCurve([[378,59,-185],[422,59,-185],[466,59,-185]],24).slice(1));
      function at(i){i=Math.max(0,Math.min(route.length-1,i));var k=Math.floor(i),a=route[k],b=route[Math.min(k+1,route.length-1)];return a.map((v,j)=>v+(b[j]-v)*(i-k))}
      var sceneStart=90;
      var originalRouteEnd=26*36;
      var routeEnd=route.length-1,mapWorldClearIndex=mapRiseEnd+40,journeyEnd=routeEnd+80;
      function sceneProgressAt(index){return (index-sceneStart)/(journeyEnd-sceneStart);}
      var routeDistances=[0];
      for(var distanceIndex=1;distanceIndex<route.length;distanceIndex++){
        var previous=route[distanceIndex-1],current=route[distanceIndex];
        routeDistances.push(routeDistances[distanceIndex-1]+Math.hypot(current[0]-previous[0],current[1]-previous[1],current[2]-previous[2]));
      }
      var cameraTrailDistance=32;
      function routeDistanceAt(index){
        var segment=Math.floor(index),next=Math.min(route.length-1,segment+1),fraction=index-segment;
        return routeDistances[segment]+(routeDistances[next]-routeDistances[segment])*fraction;
      }
      function pointBehind(index,distance){
        var target=Math.max(0,routeDistanceAt(index)-distance),low=0,high=routeDistances.length-1;
        while(low<high){var middle=(low+high)>>1;if(routeDistances[middle]<target)low=middle+1;else high=middle;}
        if(low===0)return route[0].slice();
        var start=route[low-1],end=route[low],span=routeDistances[low]-routeDistances[low-1];
        var t=span?(target-routeDistances[low-1])/span:0;
        return start.map((value,axis)=>value+(end[axis]-value)*t);
      }
      function camera(i){
        var head=at(i), rear=at(i-38);
        cameraX=head[0]*.88; cameraY=3.7+Math.min(2,head[1]*.1); cameraZ=head[2]+22;
        function unit(v){var l=Math.hypot(...v)||1;return v.map(n=>n/l)}
        var turn=smoothstep((i-originalRouteEnd)/90);
        var before=at(i-18),after=at(i+18),heading=unit([after[0]-before[0],0,after[2]-before[2]]);
        var followDistance=32+Math.max(0,72*focal/(width*1.04)-38)*turn;
        cameraTrailDistance=followDistance;
        var cameraTrackPoint=pointBehind(i,followDistance);
        cameraX+=(cameraTrackPoint[0]-cameraX)*turn;
        cameraZ+=(cameraTrackPoint[2]-cameraZ)*turn;
        cameraY+=(4.6-cameraY)*turn;
        var ascent=smoothstep((head[1]-3)/12);
        // Keep the lens above the sloped dam face while following the cables.
        cameraY+=(Math.max(cameraTrackPoint[1]+3.5,head[1]+4.5)-cameraY)*ascent;
        var targetX=head[0]+heading[0]*5*turn;
        var targetZ=head[2]-3*(1-turn)+heading[2]*5*turn;
        var targetY=(head[1]+.7)*(1-turn)+(1.15+head[1]*ascent)*turn;
        if(i>mapWorldClearIndex-8){
          // Raise the gaze during the short level advance. The cable tips approach
          // the panel lamps from below rather than overshooting and bending back.
          var departure=smoothstep((i-mapWorldClearIndex+8)/12),layout=mapLayout();
          var tipY=head[1]-2.76+.95*smoothstep((head[0]-356)/12);
          var tipDistance=Math.hypot(head[0]-cameraX,head[2]-cameraZ);
          var screenSlope=(height*.51-layout.indicatorY-height*.035)/focal;
          var pitch=Math.atan2(tipY-cameraY,tipDistance)-Math.atan(screenSlope);
          var panelTargetY=cameraY+Math.hypot(targetX-cameraX,targetZ-cameraZ)*Math.tan(pitch);
          targetY+=(panelTargetY-targetY)*departure;
        }
        cameraForward=unit([targetX-cameraX,targetY-cameraY,targetZ-cameraZ]);
        var f=cameraForward,r=cameraRight=unit([-f[2],0,f[0]]);
        cameraUp=[-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]];
      }
      var currentRouteIndex=0;
      function nearestRouteIndex(x,z,start){
        var best=start||originalRouteEnd,bestDistance=Infinity;
        for(var i=Math.max(0,start||originalRouteEnd);i<route.length;i+=2){
          var dx=route[i][0]-x,dz=route[i][2]-z,distance=dx*dx+dz*dz;
          if(distance<bestDistance){bestDistance=distance;best=i;}
        }
        return best;
      }
      var scratchA={x:0,y:0,scale:0,visible:false};
      var scratchB={x:0,y:0,scale:0,visible:false};

      function resize() {
        var rect=canvas.getBoundingClientRect();
        width=Math.max(1,rect.width); height=Math.max(1,rect.height);
        dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
        skyLayer.width=canvas.width;skyLayer.height=canvas.height;
        backgroundKey='';viewKey='';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        focal=Math.min(width,height)*1.04;
        render(performance.now()/1000);
      }

      function projectInto(x,y,z,out) {
        var dx=x-cameraX, dy=y-cameraY, dz=z-cameraZ;
        var vx=dx*cameraRight[0]+dy*cameraRight[1]+dz*cameraRight[2];
        var vy=dx*cameraUp[0]+dy*cameraUp[1]+dz*cameraUp[2];
        var depth=dx*cameraForward[0]+dy*cameraForward[1]+dz*cameraForward[2];
        if(depth<=1.6) { out.visible=false; return out; }
        var s=focal/depth;
        out.x=width*.5+vx*s;
        out.y=height*.51-vy*s;
        out.scale=s; out.depth=depth; out.visible=true;
        return out;
      }

      // Shared reciprocal-depth buffer: every architectural stroke and ribbon uses it.
      var depthBuffer=new Float32Array(0),depthWidth=0,depthHeight=0,depthScale=.5,depthKey=0;
      var depthView=-1,depthFaces=[],depthMinimum=new Float32Array(0),depthMinimumReady=new Uint8Array(0);
      var depthTiles=[],depthTileSize=8,depthTileColumns=0;
      var strokeCache=new WeakMap();
      function prepareDepth(queue){
        var faces=queue.filter(e=>e.grow>=.38).map(e=>e.face.points);
        if(depthView===viewRevision&&faces.length===depthFaces.length&&faces.every((face,i)=>face===depthFaces[i]))return;
        depthView=viewRevision;depthFaces=faces;depthKey++;
        strokeCache=new WeakMap();combinedStrokes=new WeakMap();surfaceMasks=new WeakMap();
        depthWidth=Math.ceil(width*depthScale);depthHeight=Math.ceil(height*depthScale);
        depthTiles=[];depthTileColumns=Math.ceil(depthWidth/depthTileSize);
        if(depthBuffer.length!==depthWidth*depthHeight){
          depthBuffer=new Float32Array(depthWidth*depthHeight);
          depthMinimum=new Float32Array(depthBuffer.length);depthMinimumReady=new Uint8Array(depthBuffer.length);
        }else{depthBuffer.fill(0);depthMinimumReady.fill(0);}
        queue.forEach(function(entry){
          if(entry.grow<.38)return;
          var vertices=projectedPolygon(entry.face.points);
          if(vertices.some(p=>!p.visible))return;
          for(var j=1;j<vertices.length-1;j++)rasterTriangle(vertices[0],vertices[j],vertices[j+1]);
        });
      }
      function rasterTriangle(a,b,c){
        var ax=a.x*depthScale,ay=a.y*depthScale,bx=b.x*depthScale,by=b.y*depthScale,cx=c.x*depthScale,cy=c.y*depthScale;
        var area=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);if(Math.abs(area)<.00001)return;
        var left=Math.max(0,Math.floor(Math.min(ax,bx,cx))),right=Math.min(depthWidth-1,Math.ceil(Math.max(ax,bx,cx)));
        var top=Math.max(0,Math.floor(Math.min(ay,by,cy))),bottom=Math.min(depthHeight-1,Math.ceil(Math.max(ay,by,cy)));
        var px=[ax,bx,cx],py=[ay,by,cy];
        for(var y=top;y<=bottom;y++){
          var scan=y+.5,minX=Infinity,maxX=-Infinity;
          for(var edge=0;edge<3;edge++){
            var next=(edge+1)%3;
            if((py[edge]<=scan&&py[next]>=scan)||(py[next]<=scan&&py[edge]>=scan)){
              if(py[next]===py[edge]){minX=Math.min(minX,px[edge],px[next]);maxX=Math.max(maxX,px[edge],px[next]);}
              else{var crossing=px[edge]+(px[next]-px[edge])*(scan-py[edge])/(py[next]-py[edge]);minX=Math.min(minX,crossing);maxX=Math.max(maxX,crossing);}
            }
          }
          // Keep a one-pixel guard; the original barycentric test remains authoritative.
          var rowLeft=Math.max(left,Math.floor(minX-.5)-1),rowRight=Math.min(right,Math.ceil(maxX-.5)+1);
          for(var x=rowLeft;x<=rowRight;x++){
            var u=((by-cy)*(x+.5-cx)+(cx-bx)*(y+.5-cy))/area;
            var v=((cy-ay)*(x+.5-cx)+(ax-cx)*(y+.5-cy))/area,w=1-u-v;
            if(u<0||v<0||w<0)continue;
            var inv=u/a.depth+v/b.depth+w/c.depth,index=y*depthWidth+x;
            if(inv>depthBuffer[index])depthBuffer[index]=inv;
          }
        }
      }
      function visibleAt(x,y,inv){
        var ix=Math.floor(x*depthScale),iy=Math.floor(y*depthScale);
        if(ix<0||iy<0||ix>=depthWidth||iy>=depthHeight)return true;
        // Small world-space bias keeps facade-mounted details on their own surface.
        var index=iy*depthWidth+ix,nearest=depthBuffer[index];
        if(inv+.12*inv*inv+.00008>=nearest)return true;
        // Conservative edge sampling prevents the half-resolution buffer from stippling thin lines.
        if(depthMinimumReady[index])nearest=depthMinimum[index];
        else{
          for(var oy=-1;oy<=1;oy++)for(var ox=-1;ox<=1;ox++){
            var nx=ix+ox,ny=iy+oy;
            if(nx>=0&&ny>=0&&nx<depthWidth&&ny<depthHeight)nearest=Math.min(nearest,depthBuffer[ny*depthWidth+nx]);
          }
          depthMinimum[index]=nearest;depthMinimumReady[index]=1;
        }
        return inv+.12*inv*inv+.00008>=nearest;
      }
      // Conservative tile bounds allow whole scanline spans to pass/fail at once.
      // Ambiguous spans still use the original per-pixel visibility test.
      function depthTileAt(x,y){
        var tx=Math.floor(x*depthScale/depthTileSize),ty=Math.floor(y*depthScale/depthTileSize);
        var index=ty*depthTileColumns+tx,tile=depthTiles[index];
        if(tile)return tile;
        var min=Infinity,max=0;
        for(var row=Math.max(0,ty*depthTileSize-1);row<Math.min(depthHeight,(ty+1)*depthTileSize+1);row++){
          for(var col=Math.max(0,tx*depthTileSize-1);col<Math.min(depthWidth,(tx+1)*depthTileSize+1);col++){
            var value=depthBuffer[row*depthWidth+col];min=Math.min(min,value);max=Math.max(max,value);
          }
        }
        tile={min:min,max:max};depthTiles[index]=tile;return tile;
      }
      function worldDepth(p){return (p[0]-cameraX)*cameraForward[0]+(p[1]-cameraY)*cameraForward[1]+(p[2]-cameraZ)*cameraForward[2]}
      function clipPolygon(points){
        var result=[],near=1.61;
        for(var i=0;i<points.length;i++){
          var a=points[i],b=points[(i+1)%points.length],da=worldDepth(a),db=worldDepth(b);
          if(da>=near)result.push(a);
          if((da>=near)!==(db>=near)){var t=(near-da)/(db-da);result.push(a.map((v,j)=>v+(b[j]-v)*t));}
        }
        return result;
      }
      function buildStrokeTrace(points) {
        if(points.length<2)return new Path2D();
        var trace=strokeCache.get(points);
        if(trace)return trace;
        trace=new Path2D();strokeCache.set(points,trace);
        trace.hasVisibleSamples=false;
        var open=false;
        for(var i=1;i<points.length;i++){
          var a=points[i-1],b=points[i],da=worldDepth(a),db=worldDepth(b);
          if(da<1.61&&db<1.61){open=false;continue;}
          if(da<1.61||db<1.61){var t=(1.61-da)/(db-da),cut=a.map((v,j)=>v+(b[j]-v)*t);if(da<1.61)a=cut;else b=cut;}
          var previous=projectInto(...a,{}),p=projectInto(...b,{});
          var dx=p.x-previous.x,dy=p.y-previous.y;
          // Clip screen-space extent before sampling, including very near surfaces.
          var lo=0,hi=1,valid=true;
          for(var side=0;side<4;side++){
            var direction=side===0?-dx:side===1?dx:side===2?-dy:dy;
            var extent=side===0?previous.x+2:side===1?width+2-previous.x:side===2?previous.y+2:height+2-previous.y;
            if(Math.abs(direction)<1e-9){if(extent<0)valid=false;continue;}
            var r=extent/direction;if(direction<0)lo=Math.max(lo,r);else hi=Math.min(hi,r);
          }
          if(!valid||lo>hi){open=false;continue;}
          var count=Math.max(1,Math.ceil(Math.hypot(dx,dy)*(hi-lo)/1.6));open=false;
          for(var sample=0;sample<=count;sample++){
            var t=lo+(hi-lo)*sample/count,x=previous.x+dx*t,y=previous.y+dy*t;
            var inv=(1-t)/previous.depth+t/p.depth;
            if(visibleAt(x,y,inv)){trace.hasVisibleSamples=true;if(open)trace.lineTo(x,y);else{trace.moveTo(x,y);open=true;}}
            else open=false;
          }
        }
        return trace;
      }
      function strokePath3D(points,color,alpha,lineWidth,dash,dashOffset) {
        if(points.length<2||alpha<=0)return;
        var trace=buildStrokeTrace(points);if(!trace.hasVisibleSamples)return;
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=color;
        ctx.lineWidth=lineWidth;
        ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.setLineDash(dash||[]);
        ctx.lineDashOffset=dashOffset||0;
        ctx.stroke(trace);
        ctx.restore();
      }
      function strokePaths3D(paths,color,alpha,lineWidth) {
        if(!paths.length||alpha<=0)return;
        var trace=combinedStrokes.get(paths);
        if(!trace){
          trace=new Path2D();
          trace.hasVisibleSamples=false;
          paths.forEach(function(points){if(points.length>1){var part=buildStrokeTrace(points);if(part.hasVisibleSamples){trace.addPath(part);trace.hasVisibleSamples=true;}}});
          combinedStrokes.set(paths,trace);
        }
        if(!trace.hasVisibleSamples)return;
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=color;
        ctx.lineWidth=lineWidth;
        ctx.lineCap="round";ctx.lineJoin="round";
        ctx.setLineDash([]);
        ctx.stroke(trace);
        ctx.restore();
      }

      function strokeRange3D(points,start,end,color,alpha,lineWidth) {
        if(end-start<1) return;
        ctx.save();
        ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lineWidth;
        ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.shadowColor=color; ctx.shadowBlur=18;
        ctx.beginPath();
        var open=false;
        for(var i=Math.max(0,start);i<=Math.min(points.length-1,end);i++) {
          var p=projectInto(points[i][0],points[i][1],points[i][2],i%2===0?scratchA:scratchB);
          if(!p.visible) { open=false; continue; }
          if(!open) { ctx.moveTo(p.x,p.y); open=true; } else ctx.lineTo(p.x,p.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function fillPolygon3D(points,fill,stroke,alpha) {
        if(alpha<=0)return;
        var projected=projectedPolygon(points);

      // Fill this list only after the regions have been chosen. The IDs are the

      var mapRegionSelection=[];
      var mapImage=new Image(),mapDocument=null,mapLoaded=false,mapLoadError=false;
      var mapLayers=[],mapLayerKey='',mapRegionImages=[],mapPoweredLayer=null;
      var mapReady=Promise.all([
        new Promise(function(resolve){
          mapImage.onload=function(){mapLoaded=true;mapLayerKey='';resolve(true);if(typeof update==='function')update();};
          mapImage.onerror=function(){mapLoadError=true;resolve(false);};
          mapImage.src='assets/russia-map.svg';

        new Promise(function(resolve){
          var request=new XMLHttpRequest();
