<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03060e">
  <title>Энергосцена — 3D scroll demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #03060e; }
    html { scrollbar-color: #6b82ab #080d17; }
    body { overflow-x: hidden; }
    .flight { position: relative; height: 900svh; }
    .screen {
      position: sticky; top: 0; width: 100%; height: 100svh; min-height: 0;
      overflow: hidden; background: #03060e; isolation: isolate;
    }
    .screen::after {
      content: ""; position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 53%, transparent 30%, rgba(2,6,14,.008) 72%, rgba(2,6,14,.025) 100%);
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    @media (max-width: 700px) {
      .screen { min-height: 0; }
      .flight { height: 760svh; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="flight" aria-label="Интерактивная 3D-сцена энергопередачи">
    <div class="screen">
      <canvas id="scene" aria-label="Три электрических потока проходят через здания и включают свет"></canvas>
    </div>
  </main>
  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("scene");
      var ctx = canvas.getContext("2d", { alpha: false });
      var width = 0;
      var height = 0;
      var dpr = 1;
      var focal = 600;
      var scrollProgress = 0;
      var cameraZ = 18;
      var cameraX = 0;
      var cameraY = 2.6;
      var cameraForward = [0,0,-1];
      var cameraRight = [1,0,0];
      var cameraUp = [0,1,0];
      var backgroundLightness = 0;
      var contourMix=0,contourTransition=0,lastContrastTime=0;
      var contourBase=[191,210,235],contourGlint=[250,253,255],contourHalo=[4,10,19];
      var skyLayer=document.createElement("canvas"),skyContext=skyLayer.getContext("2d");
      var cameraTrack;
      var cameraTrackLength = 0;
      var cameraTrackDistances = [];
      var cameraPosition = [0,0,0];
      var cameraTarget = [0,0,0];
      var previousTarget = [0,0,0];
      var lastFrame = 0;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function point(x, y, z) { return [x, y, z]; }

function sampleCurve(controlPoints, samplesPerLeg) {
        var out = [];
        for (var i=0;i<controlPoints.length-1;i++) {
          var p0=controlPoints[Math.max(0,i-1)], p1=controlPoints[i];
          var p2=controlPoints[i+1], p3=controlPoints[Math.min(controlPoints.length-1,i+2)];
          for (var j=0;j<samplesPerLeg;j++) {
            var t=j/samplesPerLeg, t2=t*t, t3=t2*t;
            var x=.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
            var y=.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
            var z=.5*(2*p1[2]+(-p0[2]+p2[2])*t+(2*p0[2]-5*p1[2]+4*p2[2]-p3[2])*t2+(-p0[2]+3*p1[2]-3*p2[2]+p3[2])*t3);
            out.push(point(x,y,z));
          }
        }
        out.push(controlPoints[controlPoints.length-1]);
        return out;
      }

      const stops = [
        {front:-19, back:-25, left:-30,right:-12, socket:[-18,1.35,-19], kind:0},
        {front:-49, back:-57, left:3,right:15, socket:[9,1.35,-49], kind:1},
        {front:-81,back:-90,left:-25,right:-7,socket:[-13,1.35,-81],kind:0},
        {front:-114,back:-124,left:2,right:17,socket:[8,1.35,-114],kind:1}
      ];
      const route = sampleCurve([
        [0,2.8,6],[0,2.5,3],[0,2,-5],[-8,1.5,-13],stops[0].socket,
        [-16,1.35,-21.4],[-13,1.35,-22.4],[-12,1.65,-25],[-8,2.5,-33],
        [4,2,-40],[9,1.35,-46],stops[1].socket,[8,1.35,-51],
        [3,1.35,-53],[0,1.65,-55],[-2,2.1,-61],[0,2.8,-68],[-9,1.5,-76],stops[2].socket,[-12,1.35,-84],[-8,1.7,-89],[0,2.4,-99],[8,1.35,-110],stops[3].socket,[7,1.35,-118],[0,2,-126],[0,3,-143]
      ],36);      function at(i){i=Math.max(0,Math.min(route.length-1,i));var k=Math.floor(i),a=route[k],b=route[Math.min(k+1,route.length-1)];return a.map((v,j)=>v+(b[j]-v)*(i-k))}
      function camera(i){
        var head=at(i), rear=at(i-38);
        cameraX=head[0]*.88; cameraY=3.7+Math.min(2,head[1]*.1); cameraZ=head[2]+22;
        function unit(v){var l=Math.hypot(...v)||1;return v.map(n=>n/l)}
        cameraForward=unit([head[0]-cameraX,head[1]+.7-cameraY,head[2]-3-cameraZ]);
        var f=cameraForward,r=cameraRight=unit([-f[2],0,f[0]]);
        cameraUp=[-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]];
      }
      var scratchA={x:0,y:0,scale:0,visible:false};
      var scratchB={x:0,y:0,scale:0,visible:false};
      var polyBuffer=[];
      for(var pb=0;pb<24;pb++) polyBuffer.push({x:0,y:0,scale:0,visible:false});

      function resize() {
        var rect=canvas.getBoundingClientRect();
        width=Math.max(1,rect.width); height=Math.max(1,rect.height);
        dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
        skyLayer.width=canvas.width;skyLayer.height=canvas.height;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        focal=Math.min(width,height)*1.04;
        render(performance.now()/1000);
      }

      function projectInto(x,y,z,out) {
        var dx=x-cameraX, dy=y-cameraY, dz=z-cameraZ;
        var vx=dx*cameraRight[0]+dy*cameraRight[1]+dz*cameraRight[2];
        var vy=dx*cameraUp[0]+dy*cameraUp[1]+dz*cameraUp[2];
        var depth=dx*cameraForward[0]+dy*cameraForward[1]+dz*cameraForward[2];
        if(depth<=1.6) { out.visible=false; return out; }
        var s=focal/depth;
        out.x=width*.5+vx*s;
        out.y=height*.51-vy*s;
        out.scale=s; out.depth=depth; out.visible=true;
        return out;
      }

      // Shared reciprocal-depth buffer: every architectural stroke and ribbon uses it.
      var depthBuffer=new Float32Array(0),depthWidth=0,depthHeight=0,depthScale=.5,depthKey='';
      var strokeCache=new WeakMap();
      function prepareDepth(queue){
        var key=[width,height,cameraX,cameraY,cameraZ,queue.filter(e=>e.grow>=.38).map(e=>e.building.seed)].join();if(key===depthKey)return;depthKey=key;
        depthWidth=Math.ceil(width*depthScale);depthHeight=Math.ceil(height*depthScale);
        if(depthBuffer.length!==depthWidth*depthHeight)depthBuffer=new Float32Array(depthWidth*depthHeight);
        else depthBuffer.fill(0);
        queue.forEach(function(entry){
          if(entry.grow<.38)return;
          var vertices=clipPolygon(entry.face.points).map(p=>projectInto(...p,{}));
          if(vertices.some(p=>!p.visible))return;
          for(var j=1;j<vertices.length-1;j++)rasterTriangle(vertices[0],vertices[j],vertices[j+1]);
        });
      }
      function rasterTriangle(a,b,c){
        var ax=a.x*depthScale,ay=a.y*depthScale,bx=b.x*depthScale,by=b.y*depthScale,cx=c.x*depthScale,cy=c.y*depthScale;
        var area=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);if(Math.abs(area)<.00001)return;
        var left=Math.max(0,Math.floor(Math.min(ax,bx,cx))),right=Math.min(depthWidth-1,Math.ceil(Math.max(ax,bx,cx)));
        var top=Math.max(0,Math.floor(Math.min(ay,by,cy))),bottom=Math.min(depthHeight-1,Math.ceil(Math.max(ay,by,cy)));
        for(var y=top;y<=bottom;y++)for(var x=left;x<=right;x++){
          var u=((by-cy)*(x+.5-cx)+(cx-bx)*(y+.5-cy))/area;
          var v=((cy-ay)*(x+.5-cx)+(ax-cx)*(y+.5-cy))/area,w=1-u-v;
          if(u<0||v<0||w<0)continue;
          var inv=u/a.depth+v/b.depth+w/c.depth,index=y*depthWidth+x;
          if(inv>depthBuffer[index])depthBuffer[index]=inv;
        }
      }
      function visibleAt(x,y,inv){
        var ix=Math.floor(x*depthScale),iy=Math.floor(y*depthScale);
        if(ix<0||iy<0||ix>=depthWidth||iy>=depthHeight)return true;
        // Small world-space bias keeps facade-mounted details on their own surface.
        var nearest=depthBuffer[iy*depthWidth+ix];
        // Conservative edge sampling prevents the half-resolution buffer from stippling thin lines.
        for(var oy=-1;oy<=1;oy++)for(var ox=-1;ox<=1;ox++){
          var nx=ix+ox,ny=iy+oy;
          if(nx>=0&&ny>=0&&nx<depthWidth&&ny<depthHeight)nearest=Math.min(nearest,depthBuffer[ny*depthWidth+nx]);
        }
        return inv+.12*inv*inv+.00008>=nearest;
      }
      function worldDepth(p){return (p[0]-cameraX)*cameraForward[0]+(p[1]-cameraY)*cameraForward[1]+(p[2]-cameraZ)*cameraForward[2]}
      function clipPolygon(points){
        var result=[],near=1.61;
        for(var i=0;i<points.length;i++){
          var a=points[i],b=points[(i+1)%points.length],da=worldDepth(a),db=worldDepth(b);
          if(da>=near)result.push(a);
          if((da>=near)!==(db>=near)){var t=(near-da)/(db-da);result.push(a.map((v,j)=>v+(b[j]-v)*t));}
        }
        return result;
      }
      function strokePath3D(points,color,alpha,lineWidth,dash,dashOffset) {
        if(points.length<2) return;
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=color;
        ctx.lineWidth=lineWidth;
        ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.setLineDash(dash||[]);
        ctx.lineDashOffset=dashOffset||0;
        var trace=strokeCache.get(points);
        if(trace){ctx.stroke(trace);ctx.restore();return;}
        trace=new Path2D();strokeCache.set(points,trace);
        var open=false;
        for(var i=1;i<points.length;i++){
          var a=points[i-1],b=points[i],da=worldDepth(a),db=worldDepth(b);
          if(da<1.61&&db<1.61){open=false;continue;}
          if(da<1.61||db<1.61){var t=(1.61-da)/(db-da),cut=a.map((v,j)=>v+(b[j]-v)*t);if(da<1.61)a=cut;else b=cut;}
          var previous=projectInto(...a,{}),p=projectInto(...b,{});
          var dx=p.x-previous.x,dy=p.y-previous.y;
          // Clip screen-space extent before sampling, including very near surfaces.
          var lo=0,hi=1,valid=true;
          for(var test of [[-dx,previous.x+2],[dx,width+2-previous.x],[-dy,previous.y+2],[dy,height+2-previous.y]]){
            if(Math.abs(test[0])<1e-9){if(test[1]<0)valid=false;continue;}
            var r=test[1]/test[0];if(test[0]<0)lo=Math.max(lo,r);else hi=Math.min(hi,r);
          }
          if(!valid||lo>hi){open=false;continue;}
          var count=Math.max(1,Math.ceil(Math.hypot(dx,dy)*(hi-lo)/1.6));open=false;
          for(var sample=0;sample<=count;sample++){
            var t=lo+(hi-lo)*sample/count,x=previous.x+dx*t,y=previous.y+dy*t;
            var inv=(1-t)/previous.depth+t/p.depth;
            if(visibleAt(x,y,inv)){if(open)trace.lineTo(x,y);else{trace.moveTo(x,y);open=true;}}
            else open=false;
          }
        }
        ctx.stroke(trace);
        ctx.restore();
      }

      function strokeRange3D(points,start,end,color,alpha,lineWidth) {
        if(end-start<1) return;
        ctx.save();
        ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lineWidth;
        ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.shadowColor=color; ctx.shadowBlur=18;
        ctx.beginPath();
        var open=false;
        for(var i=Math.max(0,start);i<=Math.min(points.length-1,end);i++) {
          var p=projectInto(points[i][0],points[i][1],points[i][2],i%2===0?scratchA:scratchB);
          if(!p.visible) { open=false; continue; }
          if(!open) { ctx.moveTo(p.x,p.y); open=true; } else ctx.lineTo(p.x,p.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function fillPolygon3D(points,fill,stroke,alpha) {
        points=clipPolygon(points);
        if(points.length<3) return;
        for(var i=0;i<points.length;i++) {
          var p=projectInto(points[i][0],points[i][1],points[i][2],polyBuffer[i]);
          if(!p.visible) return;
        }
        ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha;
        ctx.beginPath(); ctx.moveTo(polyBuffer[0].x,polyBuffer[0].y);
        for(var j=1;j<points.length;j++) ctx.lineTo(polyBuffer[j].x,polyBuffer[j].y);
        ctx.closePath();
        if(fill) { ctx.fillStyle=fill; ctx.fill(); }
        if(stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
        ctx.restore();
      }

      function wrappedDistance(a,b) {
        var d=Math.abs(a-b);
        return Math.min(d,1-d);
      }

      function pulsePhase(index,time) {
        return (time*.018+scrollProgress*.92+index*.105)%1;
      }

      function signalAt(route,at,time) {
        var distance=wrappedDistance(pulsePhase(route,time),at);
        return Math.max(0,1-distance/.105);
      }

      var backgroundPalette=[
        {at:0,color:[2,3,6]}, {at:.29,color:[2,3,6]},
        {at:.33,color:[10,64,220]}, {at:.68,color:[10,64,220]},
        {at:.72,color:[255,255,255]}, {at:1,color:[255,255,255]}
      ];
      function smoothstep(t) {
        t=Math.max(0,Math.min(1,t));
        return t*t*(3-2*t);
      }

      function mixColor(a,b,t) {
        return [
          Math.round(a[0]+(b[0]-a[0])*t),
          Math.round(a[1]+(b[1]-a[1])*t),
          Math.round(a[2]+(b[2]-a[2])*t)
        ];
      }

      function parseColor(hex) {
        return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
      }

      function rgb(color,alpha) {
        return alpha===undefined?"rgb("+color.join(",")+")":"rgba("+color.join(",")+","+alpha+")";
      }

      function backgroundColor(progress) {
        var index=0;
        while(index<backgroundPalette.length-2&&backgroundPalette[index+1].at<progress) index++;
        var a=backgroundPalette[index],b=backgroundPalette[index+1];
        var t=smoothstep((progress-a.at)/(b.at-a.at));
        return mixColor(a.color,b.color,t);
      }

      function drawBackground() {
        var color=backgroundColor(scrollProgress);
        var luminance=color[0]*.2126+color[1]*.7152+color[2]*.0722;
        backgroundLightness=smoothstep((luminance-42)/170);
        function relativeLuminance(c){return c.reduce((sum,v,i)=>{v=v/255;v=v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);return sum+v*[.2126,.7152,.0722][i]},0)}
        function contrast(a,b){var x=relativeLuminance(a),y=relativeLuminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
        // Choose the stronger polarity instead of interpolating through the background colour.
        var light=[197,215,240],dark=[17,29,47];
        var contrastDelta=contrast(color,dark)-contrast(color,light);
        var desiredMix=smoothstep((contrastDelta+1.35)/2.7);
        var now=performance.now(),dt=lastContrastTime?Math.min(.1,(now-lastContrastTime)/1000):0;
        lastContrastTime=now;
        contourMix+=(desiredMix-contourMix)*(reduceMotion?1:1-Math.exp(-dt/ .16));
        contourTransition=4*contourMix*(1-contourMix);
        contourBase=mixColor(light,dark,contourMix);
        contourGlint=mixColor([255,255,255],[2,8,18],contourMix);
        contourHalo=mixColor([1,6,14],[248,251,255],contourMix);
        // The whole scene changes exposure together; there is no travelling dividing line.
        ctx.fillStyle=rgb(color);ctx.fillRect(0,0,width,height);
        var strength=(1-smoothstep((scrollProgress-.68)/.04))*.055;
        var halo=ctx.createRadialGradient(width*.68,height*.34,0,width*.68,height*.34,Math.max(width,height)*.95);
        halo.addColorStop(0,rgb(mixColor(color,[0,0,0],strength)));
        halo.addColorStop(1,rgb(color));
        ctx.fillStyle=halo;ctx.fillRect(0,0,width,height);
      }
      function maskArchitecture(points){
        var projected=clipPolygon(points).map(p=>projectInto(...p,{})).filter(p=>p.visible).sort((a,b)=>a.x-b.x||a.y-b.y);
        if(projected.length<3)return;
        function cross(o,a,b){return (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x)}
        var lower=[],upper=[];
        projected.forEach(function(p){while(lower.length>1&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p)});
        projected.slice().reverse().forEach(function(p){while(upper.length>1&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p)});
        var hull=lower.slice(0,-1).concat(upper.slice(0,-1));
        ctx.save();ctx.beginPath();ctx.moveTo(hull[0].x,hull[0].y);hull.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.clip();
        ctx.drawImage(skyLayer,0,0,width,height);ctx.restore();
      }
      // Continuous streetscape: staggered architecture frames both sides of the journey.
      var streetscape=[];
      function routeCenter(z){
        var nearest=route[0];
        for(var j=1;j<route.length;j++)if(Math.abs(route[j][2]-z)<Math.abs(nearest[2]-z))nearest=route[j];
        return nearest[0];
      }
      for(var block=0;block<12;block++)for(var side=-1;side<=1;side+=2){
        var z=8-block*14.5+(side===1?-6.5:0),center=routeCenter(z);
        var w=(4.4+(block%3)*.85)*1.85,depth=(4.6+(block%3)*.7)*1.5;
        var corridor=[routeCenter(z+4),routeCenter(z),routeCenter(z-depth-4),routeCenter(z-22)*.88,routeCenter(z-depth-22)*.88];
        var edge=side<0?Math.min(...corridor):Math.max(...corridor);
        var x=edge+side*(7+w*.5+(block%2)*.8);
        var h=(7+(block*5+(side===1?4:0))%10)*2.2;
        streetscape.push({x:x,z:z,w:w,depth:depth,h:h,side:side,variant:(block+(side===1?3:0))%8,seed:block*1.37+side});
      }
      function makeArchitecture(building){
        var faces=[],x=building.x,z=building.z,w=building.w,d=building.depth,h=building.h;
        function prism(footprint,y0,tops,detail){
          if(typeof tops==='number')tops=footprint.map(()=>tops);
          var bottom=footprint.map(p=>[x+p[0],y0,z+p[1]]),top=footprint.map((p,i)=>[x+p[0],tops[i],z+p[1]]);
          var centre=[x+footprint.reduce((n,p)=>n+p[0],0)/footprint.length,(y0+Math.max(...tops))*.5,z+footprint.reduce((n,p)=>n+p[1],0)/footprint.length];
          function face(points,windows){
            var u=points[1].map((v,i)=>v-points[0][i]),v=points[2].map((v,i)=>v-points[0][i]);
            var normal=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
            var mid=points.reduce((sum,p)=>sum.map((n,i)=>n+p[i]/points.length),[0,0,0]);
            if(normal.reduce((n,v,i)=>n+v*(mid[i]-centre[i]),0)<0)normal=normal.map(v=>-v);
            faces.push({points:points,normal:normal,mid:mid,windows:windows||[]});
          }
          for(var i=0;i<footprint.length;i++){
            var j=(i+1)%footprint.length,points=[bottom[i],bottom[j],top[j],top[i]],windows=[];
            var span=Math.hypot(bottom[j][0]-bottom[i][0],bottom[j][2]-bottom[i][2]);
            if(detail&&span>.55){
              var windowStyle=building.variant%4;
              var rows=Math.max(1,Math.floor((Math.min(tops[i],tops[j])-y0-.7)/(windowStyle===3?2.7:2.1)));
              var cols=Math.max(1,Math.floor(span/(windowStyle===2?3.2:windowStyle===1?1.25:1.8)));
              for(var row=0;row<rows;row++)for(var col=0;col<cols;col++){
                var inset=windowStyle===1?.34:windowStyle===2?.08:.22;
                var t0=(col+inset)/cols,t1=(col+1-inset)/cols;
                var wy=y0+.6+row*(Math.min(tops[i],tops[j])-y0-.9)/rows,wh=(Math.min(tops[i],tops[j])-y0-.9)/rows*(windowStyle===1?.78:windowStyle===2?.38:.57);
                var ax=bottom[i][0]+(bottom[j][0]-bottom[i][0])*t0,az=bottom[i][2]+(bottom[j][2]-bottom[i][2])*t0;
                var bx=bottom[i][0]+(bottom[j][0]-bottom[i][0])*t1,bz=bottom[i][2]+(bottom[j][2]-bottom[i][2])*t1;
                windows.push({points:[[ax,wy,az],[bx,wy,bz],[bx,wy+wh,bz],[ax,wy+wh,az]],row:row,col:col,style:windowStyle});
              }
            }
            face(points,windows);
          }
          face(top);
        }
        function box(l,r,b,t,front,back,detail=true){prism([[l,front],[r,front],[r,back],[l,back]],b,t,detail)}
        if(building.variant===0){
          // Terraced residential building: three real setbacks, not a box with a roof ornament.
          box(-w*.5,w*.5,0,h*.46,0,-d);
          box(-w*.5+.3,w*.28,h*.46,h*.78,-.45,-d+.3);
          box(-w*.5+.7,w*.04,h*.78,h+1,-1,-d+.65);
        }else if(building.variant===1){
          // Slender tower with chamfered corners and a restrained sloping crown.
          var r=w*.38,c=.65;
          prism([[-r+c,0],[r-c,0],[r,-c],[r,-d+c],[r-c,-d],[-r+c,-d],[-r,-d+c],[-r,-c]],0,[h,h+1.5,h+1.5,h+1,h,h-.5,h-.5,h],true);
          box(-r-.3,r+.3,0,1.1,.2,-d-.2,false);
        }else if(building.variant===2){
          // Low industrial pavilion with a flat clerestory and rooftop ventilation.
          box(-w*.65,w*.65,0,h*.43,0,-d);
          box(-w*.42,w*.36,h*.43,h*.43+.7,-1,-d+1,true);
          for(var k=0;k<2;k++)box(-w*.3+k*w*.4,-w*.05+k*w*.4,h*.43+.7,h*.43+1.2,-1.6,-d+1.5,false);
        }else if(building.variant===3){
          // Two offset wings joined by a low podium.
          box(-w*.58,w*.58,0,1.7,.2,-d,false);
          box(-w*.55,-w*.04,1.7,h,-.15,-d*.72);
          box(w*.08,w*.53,1.7,h*.73,-d*.2,-d);
        }else if(building.variant===4){
          // Rounded corner office: a faceted cylindrical footprint with continuous curved glazing.
          var footprint=[];for(var k=0;k<14;k++){var angle=k/14*Math.PI*2;footprint.push([Math.cos(angle)*w*.52,-d*.5+Math.sin(angle)*d*.5])}
          prism(footprint,0,h,true);
          var crown=footprint.map(p=>[p[0]*.78,-d*.5+(p[1]+d*.5)*.78]);prism(crown,h,h+.65,false);
        }else if(building.variant===6){
          // Heavy industrial hall, attached administration wing and a pair of tall flues.
          box(-w*.8,w*.8,0,h*.34,0,-d);
          box(-w*.75,-w*.25,h*.34,h*.56,-d*.35,-d);
          box(w*.2,w*.62,h*.34,h*.34+.9,-1.3,-d+1.3,true);
          for(var stack=0;stack<2;stack++){
            var sx=-w*.03+stack*w*.28,foot=[];
            for(var k=0;k<10;k++){var angle=k/10*Math.PI*2;foot.push([sx+Math.cos(angle)*.44,-d*.72+Math.sin(angle)*.44])}
            prism(foot,h*.34,h*(stack?.82:1.03),false);
            var cap=foot.map(p=>[sx+(p[0]-sx)*1.18,-d*.72+(p[1]+d*.72)*1.18]);prism(cap,h*(stack?.82:1.03)-.2,h*(stack?.82:1.03)+.12,false);
          }
        }else if(building.variant===7){
          // Process plant: cylindrical storage tanks, a pump house and a connecting service bridge.
          box(-w*.75,w*.7,0,h*.18,.2,-d,false);
          for(var tank=0;tank<3;tank++){
            var sx=-w*.48+tank*w*.47,foot=[];
            for(var k=0;k<12;k++){var angle=k/12*Math.PI*2;foot.push([sx+Math.cos(angle)*w*.18,-d*.5+Math.sin(angle)*d*.34])}
            var th=h*(tank===1?.67:.49);prism(foot,h*.18,th,true);
            var cap=foot.map(p=>[sx+(p[0]-sx)*.92,-d*.5+(p[1]+d*.5)*.92]);prism(cap,th,th+.35,false);
          }
          box(-w*.6,w*.6,h*.29,h*.32,-.45,-1.05,false);
        }else{
          // Broad commercial block, recessed entrance volume and an asymmetric upper wing.
          box(-w*.64,w*.64,0,h*.48,0,-d);
          box(-w*.6,-w*.04,h*.48,h*.84,-d*.22,-d);
          box(-w*.72,w*.69,1.35,1.55,.4,-.65,false);
        }
        return faces;
      }
      streetscape.forEach(function(b){
        b.faces=makeArchitecture(b);
        var vertices=b.faces.flatMap(f=>f.points);
        b.bounds={minX:Math.min(...vertices.map(p=>p[0])),maxX:Math.max(...vertices.map(p=>p[0])),minZ:Math.min(...vertices.map(p=>p[2])),maxZ:Math.max(...vertices.map(p=>p[2]))};
      });
      function drawingProgress(building,head){
        if(reduceMotion)return scrollProgress>.001?1:0;
        var opening=smoothstep((scrollProgress-.008)/.055);
        var distance=head[2]-building.z;
        var stagger=building.side===1?3.2:0;
        var rise=smoothstep((38-distance-stagger)/17);
        return opening*rise;
      }
      function partialPath3D(points,amount){
        if(amount<=0||points.length<2)return [];
        if(amount>=1)return points;
        var lengths=points.slice(1).map((p,i)=>Math.hypot(...p.map((v,j)=>v-points[i][j])));
        var remaining=lengths.reduce((a,b)=>a+b,0)*amount,out=[points[0]];
        for(var i=0;i<lengths.length;i++){
          if(remaining>=lengths[i]){out.push(points[i+1]);remaining-=lengths[i]}
          else{var t=remaining/(lengths[i]||1);out.push(points[i].map((v,j)=>v+(points[i+1][j]-v)*t));break}
        }
        return out;
      }
      function drawStreetscape(head){
        var time=reduceMotion?0:performance.now()*.00035;
        var queue=[],active=[];
        function faceDepth(face){return (face.mid[0]-cameraX)*cameraForward[0]+(face.mid[1]-cameraY)*cameraForward[1]+(face.mid[2]-cameraZ)*cameraForward[2]}
        streetscape.forEach(function(building){
          var ahead=head[2]-building.z,grow=drawingProgress(building,head),leave=1-smoothstep((-ahead-2)/19);
          if(grow<=0||leave<=0||building.z>cameraZ-4)return;
          active.push(building);
          var roofHeight=Math.max(...building.faces.flatMap(f=>f.points.map(p=>p[1])));
          var fade=(.55+.45*(1-smoothstep((ahead-8)/62)))*Math.min(1,grow*6)*leave;
          building.faces.forEach(function(face){
            if(face.normal[0]*(cameraX-face.mid[0])+face.normal[1]*(cameraY-face.mid[1])+face.normal[2]*(cameraZ-face.mid[2])>0)
              queue.push({building:building,face:face,grow:grow,leave:leave,roofHeight:roofHeight,fade:fade,depth:faceDepth(face)});
          });
        });
        queue.sort((a,b)=>b.depth-a.depth);
        prepareDepth(queue);
        for(var pass=0;pass<2;pass++)queue.forEach(function(entry){
          var building=entry.building,face=entry.face,grow=entry.grow,leave=entry.leave,roofHeight=entry.roofHeight,fade=entry.fade;
            var points=face.points;
            if(points.length<3)return;
            var projected=clipPolygon(points).map(p=>projectInto(...p,{}));if(projected.length<3)return;
            if(pass===0){ctx.save();ctx.globalAlpha=smoothstep((grow-.35)/.4);maskArchitecture(points);ctx.restore();
            fillPolygon3D(points,rgb([65,83,108],face.normal[1]>0?.025:.04),null,smoothstep((grow-.55)/.4)*leave);
            face.windows.forEach(function(pane){
              var amount=smoothstep((grow-.5-pane.points[0][1]/roofHeight*.18-(pane.col%4)*.012)/.25);
              var light=smoothstep((building.z-head[2]-.07*pane.row-.04*pane.col)/1.4);
              if(light>0&&amount>.95){
                // Interior lamps keep a soft warm-white tone, independent of contour polarity.
                var lamp=mixColor([255,240,216],[230,206,169],backgroundLightness);
                var roomBrightness=.46+.14*(.5+.5*Math.sin(building.seed+pane.row*1.7+pane.col*2.3));
                fillPolygon3D(pane.points,rgb(lamp,light*roomBrightness),null,smoothstep((amount-.95)/.05)*leave);
              }
            });return;}
            // A travelling, continuous light band sweeps across the complete facade.
            // Its phase never resets: scrolling adds motion without a blinking loop seam.
            var screenX=projected.reduce((n,p)=>n+p.x,0)/projected.length;
            var screenY=projected.reduce((n,p)=>n+p.y,0)/projected.length;
            var span=Math.max(60,...projected.map(p=>Math.abs(p.x-screenX)),...projected.map(p=>Math.abs(p.y-screenY)))*1.4;
            var gradient=ctx.createLinearGradient(screenX-span,screenY+span*.3,screenX+span,screenY-span*.3);
            var neutralBase=contourBase;
            var neutralGlint=contourGlint;
            var phase=reduceMotion?.25:time*.42+building.seed*.11+scrollProgress*1.7;
            for(var band=0;band<=36;band++){
              var t=band/36;
              var wave=Math.pow(.5+.5*Math.cos((t*1.35-phase)*Math.PI*2),9);
              gradient.addColorStop(t,rgb(mixColor(neutralBase,neutralGlint,wave)));
            }
            ctx.save();ctx.globalCompositeOperation='source-over';
            // Trace ground-level edges first, then uprights, then roof lines.
            for(var edge=0;edge<points.length;edge++){
              var a=points[edge],b=points[(edge+1)%points.length];
              var vertical=Math.abs(a[1]-b[1])>.12;
              if(vertical&&a[1]>b[1]){var swap=a;a=b;b=swap}
              var low=Math.min(a[1],b[1])/roofHeight;
              var begin=vertical?.13+low*.22:(low<.02?0:.4+low*.13);
              var duration=vertical?.43:(low<.02?.22:.25);
              var amount=smoothstep((grow-begin)/duration);
              var path=partialPath3D([a,b],amount);
              if(path.length<2)continue;
              strokePath3D(path,'#06101e',fade*contourTransition*.3,2.5);
              strokePath3D(path,'#f4f8ff',fade*contourTransition*.2,1.5);
              strokePath3D(path,rgb(contourHalo),fade*.22,2.1);
              strokePath3D(path,gradient,fade,.95);
            }
            face.windows.forEach(function(pane){
              var points=pane.points;
              var floor=points[0][1]/roofHeight;
              var amount=smoothstep((grow-.5-floor*.18-(pane.col%4)*.012)/.25);
              if(amount<=0)return;
              var light=smoothstep((building.z-head[2]-.07*pane.row-.04*pane.col)/1.4);
              var path=partialPath3D(points.concat([points[0]]),amount);
              strokePath3D(path,'#07101e',fade*contourTransition*.22,1.5);
              strokePath3D(path,gradient,fade*.92,.65);
              if(amount>.95&&(pane.style===0||pane.style===3)){
                var a=pane.points[0],b=pane.points[1],c=pane.points[2],d=pane.points[3];
                var mid=(p,q)=>p.map((v,i)=>(v+q[i])*.5);
                strokePath3D(partialPath3D([mid(a,b),mid(d,c)],smoothstep((amount-.95)/.05)),gradient,fade*.55,.4);
                if(pane.style===3)strokePath3D([mid(a,d),mid(b,c)],gradient,fade*.55,.4);
              }
            });
            ctx.restore();
        });
        active.forEach(building=>drawPlotDetails(building,head));
      }
      function drawPlotDetails(building,head){
        var grow=drawingProgress(building,head),ahead=head[2]-building.z;
        if(grow<=0||ahead>45||ahead< -18)return;
        var leave=1-smoothstep((-ahead-2)/19),x=building.x,z=building.z,w=building.w,d=building.depth;
        var bounds=building.bounds,front=bounds.maxZ,paths=[];
        function detail(points,stage,weight,alpha){paths.push({points:points,stage:stage,weight:weight||.65,alpha:alpha===undefined?1:alpha})}
        // A fine fence along the inward plot boundary, with vertical posts and two rails.
        var fenceX=building.side<0?bounds.maxX+1.15:bounds.minX-1.15;
        if(building.variant===2||building.variant>=6||Math.abs(building.seed)%3<1.3){
          for(var v=front+1.6;v>=bounds.minZ-.6;v-=1.05)detail([[fenceX,0,v],[fenceX,1.1,v]],.1,.55);
          for(var y of [.35,.95])detail([[fenceX,y,front+1.6],[fenceX,y,bounds.minZ-.6]],.2,.6);
          // Recessed entrance gate and horizontal sign plate.
          var gx=x-w*.32;
          detail([[gx,0,front+1.6],[gx,1.65,front+1.6],[gx+w*.55,1.65,front+1.6],[gx+w*.55,0,front+1.6]],.35,.7);
          detail([[gx,1.34,front+1.6],[gx+w*.55,1.34,front+1.6]],.48,.4);
        }
        if(building.variant===2||building.variant>=6){
          // Service ladders and external pipework distinguish industrial plots.
          var lx=bounds.maxX-.75,hh=building.h*(building.variant===2?.43:building.variant===6?.34:.18)-.4;
          for(var dx of [0,.35])detail([[lx+dx,0,front+.08],[lx+dx,hh+.35,front+.08]],.3,.5);
          for(var y=.3;y<hh+.35;y+=.4)detail([[lx,y,front+.08],[lx+.35,y,front+.08]],.5,.4);
          for(var y of [hh*.55,hh*.55+.15])detail([[x-w*.65,y,front+.1],[x+w*.48,y,front+.1],[x+w*.48,hh*.85,front+.1]],.4,.6);
        }
        // Low plinth and two shallow steps anchor the building to the same ground plane.
        detail([[x-w*.3,0,front+.7],[x-w*.3,.16,front+.7],[x+w*.3,.16,front+.7],[x+w*.3,0,front+.7]],.12,.55);
        detail([[x-w*.27,.16,front+.45],[x+w*.27,.16,front+.45]],.2,.45);
        paths.forEach(function(path){
          var amount=smoothstep((grow-path.stage)/.3);if(amount<=0)return;
          var points=partialPath3D(path.points,amount);
          strokePath3D(points,rgb(contourHalo),leave*.1,1.5);
          strokePath3D(points,rgb(contourBase),leave*.72*path.alpha,path.weight);
        });
      }
      var lanes=[-1,0,1], colors=['#ff3848','#347fff','#ffffff'];
      function draw(){
        strokeCache=new WeakMap();
        const i=scrollProgress*(route.length-1),head=at(i);
        camera(i);drawBackground();skyContext.drawImage(canvas,0,0);drawStreetscape(head);
        // Far-to-near order keeps the roof and facade silhouettes coherent.
        // The four oversized flat elevations are omitted; the side buildings frame the open corridor.
        lanes.forEach(function(lane,laneIndex){
          var line=[];
          // Constant-length luminous ribbons, with fractional endpoints: no disappearing pulses.
          var start=i-88,end=i+4;
          for(var k=start;k<end;k+=.65){
            var v=at(k),spread=Math.min(1,...stops.map(stop=>Math.hypot(v[0]-stop.socket[0],v[2]-stop.front)/2.8));
            if(k<0){v[1]+=(-k)*.035;v[2]+=(-k)*.12}
            line.push([v[0]+lane*.34*spread,v[1]+lane*.12*spread,v[2]]);
          }
          var color=colors[laneIndex];
          ctx.save();ctx.globalCompositeOperation='source-over';
          strokePath3D(line,color,.07,17);strokePath3D(line,color,.17,7);
          strokePath3D(line,color,1,2.3);strokePath3D(line,'#ffffff',.72,.65);
          if(!reduceMotion){
            var phase=(performance.now()*.00022+laneIndex*.29)%1;
            var mark=Math.floor(phase*(line.length-12));
            strokePath3D(line.slice(mark,mark+12),'#ffffff',.8,2.1);
          }
          ctx.restore();
        });
      }
      function render(time) { draw(time); }

      var target=0,raf=0;
      function tick(){raf=0;scrollProgress+=(target-scrollProgress)*(reduceMotion?1:.14);if(Math.abs(target-scrollProgress)<.0001)scrollProgress=target;draw();if(target!==scrollProgress || (!document.hidden))raf=requestAnimationFrame(tick)}
      function update(){target=Math.min(1,Math.max(0,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)));if(!raf)raf=requestAnimationFrame(tick)}
      document.addEventListener("visibilitychange",update);addEventListener("scroll",update,{passive:true});addEventListener("resize",resize);resize();update();
    })();
  </script>
