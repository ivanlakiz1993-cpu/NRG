<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03060e">
  <title>Энергосцена — 3D scroll demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #03060e; }
    html { scrollbar-color: #6b82ab #080d17; }
    body { overflow-x: hidden; }
    .flight { position: relative; height: 900svh; }
    .screen {
      position: sticky; top: 0; width: 100%; height: 100svh; min-height: 0;
      overflow: hidden; background: #03060e; isolation: isolate;
    }
    .screen::after {
      content: ""; position: absolute; z-index: 1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 53%, transparent 30%, rgba(2,6,14,.04) 72%, rgba(2,6,14,.18) 100%);
    }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    @media (max-width: 700px) {
      .screen { min-height: 0; }
      .flight { height: 760svh; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="flight" aria-label="Интерактивная 3D-сцена энергопередачи">
    <div class="screen">
      <canvas id="scene" aria-label="Три электрических потока проходят через здания и включают свет"></canvas>
    </div>
  </main>
  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("scene");
      var ctx = canvas.getContext("2d", { alpha: false });
      var width = 0;
      var height = 0;
      var dpr = 1;
      var focal = 600;
      var scrollProgress = 0;
      var cameraZ = 18;
      var cameraX = 0;
      var cameraY = 2.6;
      var cameraForward = [0,0,-1];
      var cameraRight = [1,0,0];
      var cameraUp = [0,1,0];
      var backgroundLightness = 0;
      var skyLayer=document.createElement("canvas"),skyContext=skyLayer.getContext("2d");
      var cameraTrack;
      var cameraTrackLength = 0;
      var cameraTrackDistances = [];
      var cameraPosition = [0,0,0];
      var cameraTarget = [0,0,0];
      var previousTarget = [0,0,0];
      var lastFrame = 0;
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function point(x, y, z) { return [x, y, z]; }

function sampleCurve(controlPoints, samplesPerLeg) {
        var out = [];
        for (var i=0;i<controlPoints.length-1;i++) {
          var p0=controlPoints[Math.max(0,i-1)], p1=controlPoints[i];
          var p2=controlPoints[i+1], p3=controlPoints[Math.min(controlPoints.length-1,i+2)];
          for (var j=0;j<samplesPerLeg;j++) {
            var t=j/samplesPerLeg, t2=t*t, t3=t2*t;
            var x=.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
            var y=.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
            var z=.5*(2*p1[2]+(-p0[2]+p2[2])*t+(2*p0[2]-5*p1[2]+4*p2[2]-p3[2])*t2+(-p0[2]+3*p1[2]-3*p2[2]+p3[2])*t3);
            out.push(point(x,y,z));
          }
        }
        out.push(controlPoints[controlPoints.length-1]);
        return out;
      }

      const stops = [
        {front:-19, back:-25, left:-30,right:-12, socket:[-18,1.35,-19], kind:0},
        {front:-49, back:-57, left:3,right:15, socket:[9,1.35,-49], kind:1},
        {front:-81,back:-90,left:-25,right:-7,socket:[-13,1.35,-81],kind:0},
        {front:-114,back:-124,left:2,right:17,socket:[8,1.35,-114],kind:1}
      ];
      const route = sampleCurve([
        [0,14,6],[0,7,3],[0,2,-5],[-8,1.5,-13],stops[0].socket,
        [-16,1.35,-21.4],[-13,1.35,-22.4],[-12,1.65,-25],[-8,2.5,-33],
        [4,2,-40],[9,1.35,-46],stops[1].socket,[8,1.35,-51],
        [3,1.35,-53],[0,1.65,-55],[-2,2.1,-61],[0,2.8,-68],[-9,1.5,-76],stops[2].socket,[-12,1.35,-84],[-8,1.7,-89],[0,2.4,-99],[8,1.35,-110],stops[3].socket,[7,1.35,-118],[0,2,-126],[0,3,-143]
      ],36);      function at(i){i=Math.max(0,Math.min(route.length-1,i));var k=Math.floor(i),a=route[k],b=route[Math.min(k+1,route.length-1)];return a.map((v,j)=>v+(b[j]-v)*(i-k))}
      function camera(i){
        var head=at(i), rear=at(i-38);
        cameraX=head[0]*.88; cameraY=5.8+Math.min(3,head[1]*.18); cameraZ=head[2]+22;
        function unit(v){var l=Math.hypot(...v)||1;return v.map(n=>n/l)}
        cameraForward=unit([head[0]-cameraX,head[1]+.7-cameraY,head[2]-3-cameraZ]);
        var f=cameraForward,r=cameraRight=unit([-f[2],0,f[0]]);
        cameraUp=[-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]];
      }
      var scratchA={x:0,y:0,scale:0,visible:false};
      var scratchB={x:0,y:0,scale:0,visible:false};
      var polyBuffer=[];
      for(var pb=0;pb<24;pb++) polyBuffer.push({x:0,y:0,scale:0,visible:false});

      function resize() {
        var rect=canvas.getBoundingClientRect();
        width=Math.max(1,rect.width); height=Math.max(1,rect.height);
        dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
        skyLayer.width=canvas.width;skyLayer.height=canvas.height;
        ctx.setTransform(dpr,0,0,dpr,0,0);
        focal=Math.min(width,height)*1.04;
        render(performance.now()/1000);
      }

      function projectInto(x,y,z,out) {
        var dx=x-cameraX, dy=y-cameraY, dz=z-cameraZ;
        var vx=dx*cameraRight[0]+dy*cameraRight[1]+dz*cameraRight[2];
        var vy=dx*cameraUp[0]+dy*cameraUp[1]+dz*cameraUp[2];
        var depth=dx*cameraForward[0]+dy*cameraForward[1]+dz*cameraForward[2];
        if(depth<=1.6) { out.visible=false; return out; }
        var s=focal/depth;
        out.x=width*.5+vx*s;
        out.y=height*.51-vy*s;
        out.scale=s; out.visible=true;
        return out;
      }

      function strokePath3D(points,color,alpha,lineWidth,dash,dashOffset) {
        if(points.length<2) return;
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.strokeStyle=color;
        ctx.lineWidth=lineWidth;
        ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.setLineDash(dash||[]);
        ctx.lineDashOffset=dashOffset||0;
        ctx.beginPath();
        var open=false;
        for(var i=0;i<points.length;i++) {
          var p=projectInto(points[i][0],points[i][1],points[i][2],i%2===0?scratchA:scratchB);
          if(!p.visible) { open=false; continue; }
          if(!open) { ctx.moveTo(p.x,p.y); open=true; } else ctx.lineTo(p.x,p.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function strokeRange3D(points,start,end,color,alpha,lineWidth) {
        if(end-start<1) return;
        ctx.save();
        ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=lineWidth;
        ctx.lineCap="round"; ctx.lineJoin="round";
        ctx.shadowColor=color; ctx.shadowBlur=18;
        ctx.beginPath();
        var open=false;
        for(var i=Math.max(0,start);i<=Math.min(points.length-1,end);i++) {
          var p=projectInto(points[i][0],points[i][1],points[i][2],i%2===0?scratchA:scratchB);
          if(!p.visible) { open=false; continue; }
          if(!open) { ctx.moveTo(p.x,p.y); open=true; } else ctx.lineTo(p.x,p.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function fillPolygon3D(points,fill,stroke,alpha) {
        if(points.length<3) return;
        for(var i=0;i<points.length;i++) {
          var p=projectInto(points[i][0],points[i][1],points[i][2],polyBuffer[i]);
          if(!p.visible) return;
        }
        ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha;
        ctx.beginPath(); ctx.moveTo(polyBuffer[0].x,polyBuffer[0].y);
        for(var j=1;j<points.length;j++) ctx.lineTo(polyBuffer[j].x,polyBuffer[j].y);
        ctx.closePath();
        if(fill) { ctx.fillStyle=fill; ctx.fill(); }
        if(stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=1; ctx.stroke(); }
        ctx.restore();
      }

      function wrappedDistance(a,b) {
        var d=Math.abs(a-b);
        return Math.min(d,1-d);
      }

      function pulsePhase(index,time) {
        return (time*.018+scrollProgress*.92+index*.105)%1;
      }

      function signalAt(route,at,time) {
        var distance=wrappedDistance(pulsePhase(route,time),at);
        return Math.max(0,1-distance/.105);
      }

      var backgroundPalette=[
        {at:0,color:[3,7,16]},
        {at:.24,color:[12,39,78]},
        {at:.48,color:[232,242,252]},
        {at:.72,color:[35,106,226]},
        {at:1,color:[4,10,23]}
      ];

      function smoothstep(t) {
        t=Math.max(0,Math.min(1,t));
        return t*t*(3-2*t);
      }

      function mixColor(a,b,t) {
        return [
          Math.round(a[0]+(b[0]-a[0])*t),
          Math.round(a[1]+(b[1]-a[1])*t),
          Math.round(a[2]+(b[2]-a[2])*t)
        ];
      }

      function parseColor(hex) {
        return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
      }

      function rgb(color,alpha) {
        return alpha===undefined?"rgb("+color.join(",")+")":"rgba("+color.join(",")+","+alpha+")";
      }

      function backgroundColor(progress) {
        var index=0;
        while(index<backgroundPalette.length-2&&backgroundPalette[index+1].at<progress) index++;
        var a=backgroundPalette[index],b=backgroundPalette[index+1];
        var t=smoothstep((progress-a.at)/(b.at-a.at));
        return mixColor(a.color,b.color,t);
      }

      function drawBackground() {
        var progress=scrollProgress;
        var color=backgroundColor(progress);
        var luminance=color[0]*.2126+color[1]*.7152+color[2]*.0722;
        backgroundLightness=smoothstep((luminance-36)/174);
        var dark=[2,5,12],blue=[20,83,190],ice=[236,245,255];
        var top=mixColor(dark,color,.72);
        var middle=mixColor(color,blue,.18);
        var bottom=mixColor(color,ice,.12+.2*backgroundLightness);
        var gradient=ctx.createLinearGradient(width*(.12+.28*progress),0,width*(.78-.22*progress),height);
        gradient.addColorStop(0,rgb(top));
        gradient.addColorStop(.48,rgb(middle));
        gradient.addColorStop(1,rgb(bottom));
        ctx.fillStyle=gradient;
        ctx.fillRect(0,0,width,height);
        var glowX=width*(.22+.56*progress);
        var glowY=height*(.72-.44*progress);
        var haze=ctx.createRadialGradient(glowX,glowY,0,glowX,glowY,Math.max(width,height)*.54);
        haze.addColorStop(0,"rgba(55,139,255,"+(.09+.08*(1-backgroundLightness))+ ")");
        haze.addColorStop(.42,"rgba(35,102,213,.08)");
        haze.addColorStop(1,"rgba(2,7,14,0)");
        ctx.fillStyle=haze;ctx.fillRect(0,0,width,height);
      }
      // Architectural line drawings: all details lie in the facade plane.
      function architecturalDrawing(factory,variant){
        var seams=[],windows=[];
        function line(p,weight){seams.push({points:p,weight:weight||1})}
        function pane(x,y,w,h){
          line([[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]],.62);
          line([[x+w*.5,y],[x+w*.5,y+h]],.38);
          windows.push([x+.045,y+.045,w-.09,h-.09]);
        }
        if(!factory){
          var left=-11.6,right=5.8,roof=variant?10.2:8.5;
          // Continuous outer silhouette, stepped parapet and a narrow corner return.
          line([[left,0],[left,roof-.8],[-10.9,roof-.8],[-10.9,roof],[-3.8,roof],[-3.8,roof-.32],[right,roof-.32],[right,0],[left,0]],1.1);
          line([[left,roof-.8],[-12.1,roof-1.15],[-12.1,.35],[left,0]],.7);
          line([[-10.9,roof-.18],[-3.98,roof-.18],[-3.98,roof-.5],[right,roof-.5]],.6);
          line([[left,.2],[right,.2]],.65);
          var floors=variant?5:4,step=(roof-2.0)/floors;
          for(var f=0;f<floors;f++){
            var y=1.8+f*step;
            line([[left,y-.16],[right,y-.16]],.42);
            for(var c=0;c<11;c++)pane(-10.95+c*1.48,y,1.04,step*.68);
          }
          // Slender curtain-wall mullions, recessed entrance and canopy.
          for(var c=0;c<12;c++){var x=-11.18+c*1.48;line([[x,1.62],[x,roof-.6]],.24)}
          line([[left,1.55],[right,1.55],[right+.22,1.35],[left-.2,1.35],[left,1.55]],.8);
          for(var c=0;c<10;c++)pane(-10.95+c*1.62,.33,1.26,.88);
          line([[-.95,.2],[-.95,1.35],[.95,1.35],[.95,.2]],.9);
          line([[0,.2],[0,1.35]],.55);
          line([[-11.85,.5],[-11.85,roof-1.2]],.35);
          // Rooftop plant and aerials stay part of the same fine line illustration.
          line([[-8.2,roof],[-8.2,roof+.52],[-5.2,roof+.52],[-5.2,roof]],.62);
          for(var v=0;v<8;v++)line([[-7.98+v*.34,roof+.1],[-7.98+v*.34,roof+.42]],.3);
          line([[3.9,roof-.32],[3.9,roof+.85],[4.12,roof+.85]],.5);
        }else{
          // Flat industrial roof with a slim parapet and low mechanical plant.
          line([[-5.8,0],[-5.8,4.05],[5.8,4.05],[5.8,0],[-5.8,0]],1.05);
          line([[-5.8,3.78],[5.8,3.78]],.55);
          line([[-5.92,4.05],[-5.92,4.18],[5.92,4.18],[5.92,4.05]],.65);
          for(var unit=0;unit<2;unit++){
            var x=-3.1+unit*3.5;
            line([[x,4.18],[x,4.86],[x+2.15,4.86],[x+2.15,4.18]],.65);
            line([[x-.12,4.86],[x-.12,4.98],[x+2.27,4.98],[x+2.27,4.86]],.45);
            for(var fin=0;fin<7;fin++)line([[x+.18+fin*.28,4.32],[x+.18+fin*.28,4.72]],.28);
          }
          line([[-5.8,.2],[5.8,.2]],.65);
          line([[-5.8,2.9],[5.8,2.9]],.4);
          for(var c=0;c<14;c++)pane(-5.48+c*.79,2.02,.54,.56);
          for(var bay=0;bay<4;bay++){
            var x=-5.35+bay*2.82;
            line([[x,.2],[x,1.65],[x+2.22,1.65],[x+2.22,.2]],.7);
            for(var slat=0;slat<6;slat++)line([[x+.08,.37+slat*.19],[x+2.14,.37+slat*.19]],.24);
          }
          for(var t=0;t<2;t++){
            var x=2.65+t*1.55,h=9.4-t*1.7+(variant?.8:0);
            line([[x,4.18],[x,h],[x+.52,h],[x+.52,4.18]],.85);
            line([[x-.09,h-.18],[x+.61,h-.18],[x+.61,h],[x-.09,h],[x-.09,h-.18]],.6);
            line([[x+.14,5.2],[x+.14,h-.35]],.3);
            for(var y=5.45;y<h-.5;y+=.7)line([[x,y],[x+.52,y]],.3);
          }
          line([[-4.8,4.18],[-4.8,6.45],[-3.85,6.45],[-3.85,4.18]],.65);
          line([[-4.95,6.45],[-4.95,6.65],[-3.7,6.65],[-3.7,6.45]],.55);
          // Exterior pipework, valves and service ladder.
          line([[-5.55,1.78],[5.4,1.78],[5.4,3.25],[4.75,3.25]],.45);
          line([[-5.55,1.88],[5.5,1.88],[5.5,3.35],[4.75,3.35]],.35);
          line([[5.9,.2],[5.9,3.55]],.5);line([[6.15,.2],[6.15,3.55]],.5);
          for(var y=.4;y<3.55;y+=.28)line([[5.9,y],[6.15,y]],.35);
        }
        seams.forEach(function(path){
          path.lengths=path.points.slice(1).map((p,j)=>Math.hypot(p[0]-path.points[j][0],p[1]-path.points[j][1]));
          path.length=path.lengths.reduce((a,b)=>a+b,0);
        });
        return {seams:seams,windows:windows};
      }
      const elevations=[architecturalDrawing(false,0),architecturalDrawing(true,0),architecturalDrawing(false,1),architecturalDrawing(true,1)];
      function buildingInk(stop,index){
        var origin=projectInto(stop.socket[0],4,stop.front,{});
        if(!origin.visible)return rgb(mixColor([112,131,158],[63,84,113],backgroundLightness));
        var span=Math.max(100,origin.scale*22);
        var time=reduceMotion?0:performance.now()*.00021;
        var phase=time+scrollProgress*2.4+index*.47;
        // Periodic bands are continuous at the edges: no resetting sweep or flashing facade.
        var gradient=ctx.createLinearGradient(origin.x-span*.7,origin.y+span*.3,origin.x+span*.7,origin.y-span*.3);
        for(var k=0;k<=32;k++){
          var t=k/32;
          var wave=Math.pow(.5+.5*Math.sin(t*Math.PI*3-phase*Math.PI*2),5);
          var base=mixColor([95,106,124],[51,67,91],backgroundLightness);
          var shine=mixColor([224,233,247],[106,136,177],backgroundLightness);
          gradient.addColorStop(t,rgb(mixColor(base,shine,wave)));
        }
        return gradient;
      }
      function traceProjectedPath(stop,points,amount){
        if(amount<=0 || points.length<2)return;
        const lengths=points.slice(1).map(([x,y],j)=>Math.hypot(x-points[j][0],y-points[j][1]));
        let remaining=Math.min(1,amount)*lengths.reduce((sum,n)=>sum+n,0);
        ctx.beginPath();
        let open=false;
        for(let j=0;j<lengths.length && remaining>0;j++){
          const [x,y]=points[j], [nx,ny]=points[j+1];
          const fraction=Math.min(1,remaining/lengths[j]);
          const ax=stop.socket[0]+x, bx=stop.socket[0]+x+(nx-x)*fraction;
          const ay=y, by=y+(ny-y)*fraction;
          const a=projectInto(ax,ay,stop.front,scratchA);
          const b=projectInto(bx,by,stop.front,scratchB);
          if(a.visible && b.visible){
            if(!open)ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);open=true;
          }else{
            open=false;
            if(b.visible)ctx.moveTo(b.x,b.y);
          }
          remaining-=lengths[j];
        }
        ctx.stroke();
      }

      function traceElevation(stop,drawing,head,index){
        const reveal=smoothstep((stop.front+44-head[2])/35);
        const origin=projectInto(...stop.socket,{});
        if(!origin.visible || reveal<=0)return;
        maskArchitecture(drawing.seams[0].points.map(p=>[stop.socket[0]+p[0],p[1],stop.front]));
        ctx.save();
        ctx.strokeStyle=buildingInk(stop,index);ctx.lineJoin='round';ctx.lineCap='round';
        ctx.globalAlpha=.9;ctx.shadowBlur=0;
        drawing.seams.forEach(function(path,j){
          ctx.lineWidth=path.weight;
          traceProjectedPath(stop,path.points,(reveal-.12*j/drawing.seams.length)/.78);
        });
        // Window light matches the drawn frames precisely; the surrounding facade stays transparent.
        drawing.windows.forEach(function(window,j){
          var lit=smoothstep((stop.front-head[2]-(j%11)*.055)/1.8);
          if(!lit)return;
          var x=window[0],y=window[1],w=window[2],h=window[3];
          fillPolygon3D([[stop.socket[0]+x,y,stop.front],[stop.socket[0]+x+w,y,stop.front],[stop.socket[0]+x+w,y+h,stop.front],[stop.socket[0]+x,y+h,stop.front]],rgb([198,222,255],lit*(.55+.2*(.5+.5*Math.sin(j*2.3)))),null,1);
        });
        ctx.restore();
      }
      function maskArchitecture(points){
        var projected=points.map(p=>projectInto(...p,{})).filter(p=>p.visible).sort((a,b)=>a.x-b.x||a.y-b.y);
        if(projected.length<3)return;
        function cross(o,a,b){return (a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x)}
        var lower=[],upper=[];
        projected.forEach(function(p){while(lower.length>1&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p)});
        projected.slice().reverse().forEach(function(p){while(upper.length>1&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p)});
        var hull=lower.slice(0,-1).concat(upper.slice(0,-1));
        ctx.save();ctx.beginPath();ctx.moveTo(hull[0].x,hull[0].y);hull.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.clip();
        ctx.drawImage(skyLayer,0,0,width,height);ctx.restore();
      }
      // Continuous streetscape: staggered architecture frames both sides of the journey.
      var streetscape=[];
      function routeCenter(z){
        var nearest=route[0];
        for(var j=1;j<route.length;j++)if(Math.abs(route[j][2]-z)<Math.abs(nearest[2]-z))nearest=route[j];
        return nearest[0];
      }
      for(var block=0;block<17;block++)for(var side=-1;side<=1;side+=2){
        var z=8-block*11.5+(side===1?-5:0),center=routeCenter(z);
        var w=4.2+(block%3)*1.2,depth=4+(block%4)*.9;
        var x=center+side*(8+w*.5+(block%2)*1.2);
        var h=7+(block*7+(side+1)*2)%9;
        streetscape.push({x:x,z:z,w:w,depth:depth,h:h,side:side,variant:(block+(side+1))%4,seed:block*1.37+side});
      }
      function drawStreetscape(head){
        var time=reduceMotion?0:performance.now()*.0006;
        // Fixed world positions and depth ordering preserve parallax as the camera passes.
        var ordered=streetscape.slice().sort((a,b)=>a.z-b.z);
        ordered.forEach(function(building){
          var ahead=head[2]-building.z;
          var grow=smoothstep((70-ahead)/36);
          var leave=1-smoothstep((-ahead-2)/19);
          if(grow<=0||leave<=0||building.z>cameraZ-4)return;
          var x=building.x,z=building.z,w=building.w,d=building.depth;
          var left=x-w*.5,right=x+w*.5,h=building.h*grow;
          var lines=[],facadeWindows=[];
          function line(points,weight){lines.push({points:points,weight:weight||.65})}
          // Only silhouette, roof and the camera-facing return: no visible rear wireframe.
          var nearSide=cameraX<x?left:right,farSide=cameraX<x?right:left;
          line([[left,0,z],[left,h,z],[right,h,z],[right,0,z]],.8);
          line([[left,0,z],[right,0,z]],.45);
          line([[nearSide,0,z],[nearSide,0,z-d],[nearSide,h,z-d],[nearSide,h,z]],.65);
          line([[nearSide,h,z-d],[farSide,h,z-d],[farSide,h,z]],.55);
          if(building.variant===0){
            // Recessed crown, narrow vertical ribs, raised podium.
            line([[left-.25,1.05*grow,z+.35],[right+.25,1.05*grow,z+.35],[right+.25,0,z+.35]],.65);
            line([[left+.45,h,z],[left+.45,h+.75*grow,z-.5],[right-.6,h+.75*grow,z-.5],[right-.6,h,z]],.65);
            line([[nearSide+(cameraX<x?.38:-.38),1.1*grow,z+.01],[nearSide+(cameraX<x?.38:-.38),h-.5*grow,z+.01]],.35);
          }else if(building.variant===1){
            // Offset upper tower creates a stepped commercial silhouette.
            var top=h+3.4*grow;
            line([[left+.7,h,z-.7],[left+.7,top,z-.7],[right-.5,top,z-.7],[right-.5,h,z-.7]],.7);
            line([[left+.7,top,z-.7],[left+.7,top,z-d+.5],[right-.5,top,z-d+.5],[right-.5,top,z-.7]],.5);
            line([[left,h*.78,z],[right,h*.78,z]],.28);
          }else if(building.variant===2){
            // Industrial annex and roof lantern.
            line([[left-.8,0,z+.5],[left-.8,h*.34,z+.5],[right+.5,h*.34,z+.5],[right+.5,0,z+.5]],.7);
            line([[left-.8,h*.34,z+.5],[left-.8,h*.34,z-1.2],[right+.5,h*.34,z-1.2]],.4);
            line([[x-.5,h,z-1],[x-.5,h+2*grow,z-1],[x+.5,h+2*grow,z-1],[x+.5,h,z-1]],.55);
          }else{
            line([[left+.25,0,z+.05],[left+.25,h,z+.05]],.35);
            line([[right-.25,0,z+.05],[right-.25,h,z+.05]],.35);
            line([[left,h-.3*grow,z],[right,h-.3*grow,z]],.4);
          }
          // Window frames and illumination exist on every building, including the side return.
          function windowPane(points,row,col){
            facadeWindows.push({points:points,row:row,col:col});
            line(points.concat([points[0]]),.38);
          }
          var floors=Math.max(3,Math.floor(building.h/1.7)),cols=building.variant===3?3:4;
          var base=building.variant===2?building.h*.37:1.25;
          var stepY=(building.h-.65-base)/floors;
          for(var row=0;row<floors;row++)for(var col=0;col<cols;col++){
            var wx=left+.48+col*(w-.8)/cols,wy=(base+row*stepY)*grow;
            var ww=(w-.8)/cols*.57,wh=stepY*.54*grow;
            windowPane([[wx,wy,z+.025],[wx+ww,wy,z+.025],[wx+ww,wy+wh,z+.025],[wx,wy+wh,z+.025]],row,col);
          }
          for(var row=0;row<floors;row++)for(var col=0;col<3;col++){
            var wz=z-.55-col*(d-.9)/3,wy=(base+row*stepY)*grow;
            var wd=(d-.9)/3*.55,wh=stepY*.54*grow;
            windowPane([[nearSide,wy,wz],[nearSide,wy,wz-wd],[nearSide,wy+wh,wz-wd],[nearSide,wy+wh,wz]],row,col+cols);
          }
          if(building.variant===1)for(var row=0;row<2;row++)for(var col=0;col<3;col++){
            var wx=left+1+col*(w-1.6)/3,wy=h+(.55+row*1.25)*grow,ww=(w-1.6)/3*.55;
            windowPane([[wx,wy,z-.68],[wx+ww,wy,z-.68],[wx+ww,wy+.65*grow,z-.68],[wx,wy+.65*grow,z-.68]],row+floors,col);
          }
          if(building.variant===2)for(var col=0;col<4;col++){
            var wx=left-.45+col*(w+.9)/4,wy=building.h*.19*grow,ww=(w+.9)/4*.6,wh=.7*grow;
            windowPane([[wx,wy,z+.525],[wx+ww,wy,z+.525],[wx+ww,wy+wh,z+.525],[wx,wy+wh,z+.525]],0,col);
          }
          maskArchitecture(lines.flatMap(path=>path.points));
          facadeWindows.forEach(function(pane){
            // The head crossing this facade's depth powers the building, floor by floor.
            var light=smoothstep((building.z-head[2]-.07*pane.row-.045*pane.col)/1.4);
            if(light<=0)return;
            ctx.save();ctx.shadowColor='rgba(192,222,255,.7)';ctx.shadowBlur=5*light;
            var brightness=.55+.2*(.5+.5*Math.sin(building.seed+pane.row*1.7+pane.col*2.3));
            fillPolygon3D(pane.points,rgb([213,233,255],light*brightness),null,grow*leave);
            ctx.restore();
          });
          var distanceFade=.35+.65*(1-smoothstep((ahead-10)/65));
          lines.forEach(function(path,j){
            var first=projectInto(...path.points[0],{}),last=projectInto(...path.points[path.points.length-1],{});
            if(!first.visible||!last.visible)return;
            var shimmer=.5+.5*Math.sin(time+building.seed+j*.41+scrollProgress*8);
            var gradient=ctx.createLinearGradient(first.x,first.y,last.x+.1,last.y+.1);
            var dark=mixColor([69,91,125],[57,76,105],backgroundLightness);
            var bright=mixColor([160,179,204],[109,134,169],backgroundLightness);
            gradient.addColorStop(0,rgb(mixColor(dark,bright,shimmer*.55)));
            gradient.addColorStop(.5,rgb(mixColor(dark,bright,.25+.75*shimmer)));
            gradient.addColorStop(1,rgb(dark));
            strokePath3D(path.points,gradient,grow*leave*distanceFade*.77,path.weight);
          });
        });
      }
      var lanes=[-1,0,1], colors=['#ff3848','#347fff','#ffffff'];
      function draw(){
        const i=scrollProgress*(route.length-1),head=at(i);
        camera(i);drawBackground();skyContext.drawImage(canvas,0,0);drawStreetscape(head);
        // Far-to-near order keeps the roof and facade silhouettes coherent.
        for(var n=stops.length-1;n>=0;n--){traceElevation(stops[n],elevations[n],head,n)}
        lanes.forEach(function(lane,laneIndex){
          var line=[];
          // Constant-length luminous ribbons, with fractional endpoints: no disappearing pulses.
          var start=i-88,end=i+4;
          for(var k=start;k<end;k+=.65){
            var v=at(k),spread=Math.min(1,...stops.map(stop=>Math.hypot(v[0]-stop.socket[0],v[2]-stop.front)/2.8));
            if(k<0){v[1]+=(-k)*.035;v[2]+=(-k)*.12}
            line.push([v[0]+lane*.34*spread,v[1]+lane*.12*spread,v[2]]);
          }
          var color=colors[laneIndex];
          ctx.save();ctx.globalCompositeOperation='screen';
          strokePath3D(line,color,.07,17);strokePath3D(line,color,.17,7);
          strokePath3D(line,color,1,2.3);strokePath3D(line,'#ffffff',.72,.65);
          if(!reduceMotion){
            var phase=(performance.now()*.00022+laneIndex*.29)%1;
            var mark=Math.floor(phase*(line.length-12));
            strokePath3D(line.slice(mark,mark+12),'#ffffff',.8,2.1);
          }
          ctx.restore();
        });
      }
      function render(time) { draw(time); }

      var target=0,raf=0;
      function tick(){raf=0;scrollProgress+=(target-scrollProgress)*(reduceMotion?1:.14);if(Math.abs(target-scrollProgress)<.0001)scrollProgress=target;draw();if(target!==scrollProgress || (!document.hidden))raf=requestAnimationFrame(tick)}
      function update(){target=Math.min(1,Math.max(0,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)));if(!raf)raf=requestAnimationFrame(tick)}
      document.addEventListener("visibilitychange",update);addEventListener("scroll",update,{passive:true});addEventListener("resize",resize);resize();update();
    })();
  </script>
</body>
</html>
